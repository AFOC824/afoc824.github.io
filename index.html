<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OOO</title>
  <meta name="description" content="OOO · OO대학교 OOOO학과 학부연구생">

  <meta property="og:type" content="website">
  <meta property="og:title" content="OOO">
  <meta property="og:description" content="OOO · OO대학교 OOOO학과 학부연구생">

  <script>
    // 테마를 화면이 그려지기 전에 적용 (깜빡임 방지)
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      document.documentElement.classList.add("js");
    })();
  </script>

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <style>
    /* ============================================================
       1. 색상 토큰 — profile.html / community.html과 동일하게 유지할 것
       ============================================================ */
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text: #1a1a18;
      --muted: #78766f;
      --faint: #a8a5a0;
      --line: #e4e1da;
      --field: #ffffff;
      --shell: 1400px;
      --gutter: clamp(20px, 5vw, 80px);
    }

    [data-theme="dark"] {
      --bg: #101010;
      --surface: #171716;
      --text: #ececea;
      --muted: #8f8d87;
      --faint: #5e5c57;
      --line: #2a2a28;
      --field: #1a1a19;
    }

    /* ============================================================
       2. 기본
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      font-feature-settings: "tnum";
    }

    a { color: inherit; }

    .shell {
      max-width: var(--shell);
      margin: 0 auto;
      padding-inline: var(--gutter);
    }

    ::selection { background: var(--text); color: var(--bg); }

    /* ============================================================
       3. 테마 토글 (우측 상단 고정)
       ============================================================ */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: clamp(20px, 5vw, 80px);
      z-index: 50;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 0.9rem;
      font-family: inherit;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .theme-toggle:hover { color: var(--text); border-color: var(--muted); }

    /* ============================================================
       4. 대문
       ============================================================ */
    .landing {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-block: 80px 60px;
    }

    .landing h1 {
      margin: 0;
      font-size: clamp(3.2rem, 13vw, 10rem);
      font-weight: 600;
      line-height: 0.92;
      letter-spacing: -0.045em;
    }

    .landing-actions {
      margin-top: 56px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .landing-btn {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 22px 44px;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .landing-btn:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* ============================================================
       5. 푸터
       ============================================================ */
    .footer {
      padding-block: 24px 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 32px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer .spacer { margin-left: auto; }
    .footer a { text-decoration: none; border-bottom: 1px solid var(--line); }
    .footer a:hover { border-color: var(--muted); }

    /* ============================================================
       6. 등장 모션
       ============================================================ */
    .js .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .js .reveal.in { opacity: 1; transform: none; }
    .js .reveal.d1 { transition-delay: 0.08s; }
    .js .reveal.d2 { transition-delay: 0.16s; }

    /* ============================================================
       7. 좁은 화면
       ============================================================ */
    @media (max-width: 900px) {
      .landing-actions { flex-direction: column; }
      .landing-btn { padding: 18px 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .js .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>

<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☾</button>

  <main class="shell landing">
    <h1 class="reveal">824</h1>
    <div class="landing-actions reveal d1">
      <a class="landing-btn" href="profile.html">Profile →</a>
      <a class="landing-btn" href="community.html">Board →</a>
    </div>
  </main>

  <footer class="footer shell">
    <span>Email · OOOOO [at] OOOOOO</span>
    <span>GitHub · <a href="https://github.com/afoc824">github.com/afoc824</a></span>
    <span class="spacer">© 2026 OOO</span>
  </footer>

  <script>
    // ===== 테마 토글 =====
    (function () {
      var toggle = document.getElementById("themeToggle");
      var root = document.documentElement;

      function current() {
        return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }

      function label() {
        toggle.textContent = current() === "dark" ? "☀" : "☾";
      }

      label();

      toggle.onclick = function () {
        var next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        label();
      };
    })();

    // ===== 등장 모션 =====
    (function () {
      var targets = document.querySelectorAll(".reveal");

      function showAll() {
        targets.forEach(function (el) { el.classList.add("in"); });
      }

      if (!("IntersectionObserver" in window)) { showAll(); return; }

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add("in");
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });

      targets.forEach(function (el) { io.observe(el); });

      // 안전장치: 3초 안에 아무것도 안 보이면 전부 표시
      setTimeout(function () {
        if (!document.querySelector(".reveal.in")) showAll();
      }, 3000);
    })();
  </script>

</body>
</html>
