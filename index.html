<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // 저장소가 차단되어도 기본 테마로 화면을 표시한다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      // 모션 감소 설정에서는 장막 없이 바로 내용을 표시한다.
      if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("intro-playing");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <title>824</title>
  <meta name="description" content="824. A personal space for a profile, shared thoughts, and recommendations.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="824">
  <meta property="og:description" content="The personal space of OOO. Profile and community.">
  <style>
    :root {
      --bg: #f8f8f8; --surface: #eeeeee; --text: #181818;
      --muted: #444444; --faint: #595959; --line: #d5d5d5; --field: #ffffff;
      --shell: 1440px; --gutter: clamp(22px, 5vw, 80px);
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #141414; --surface: #202020; --text: #f2f2f2;
      --muted: #cccccc; --faint: #b5b5b5; --line: #3c3c3c; --field: #1b1b1b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 17px; font-weight: 450; line-height: 1.65; }
    a { color: inherit; text-underline-offset: 6px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    svg { display: block; max-width: 100%; }
    ::selection { background: var(--text); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 12px 20px; background: var(--text); color: var(--bg); transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .home { width: 100%; max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    .site-header { min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .wordmark { display: inline-flex; align-items: center; min-height: 44px; font: .94rem var(--font-mono); letter-spacing: -.025em; text-decoration: none; }
    .theme-toggle { display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
    .theme-toggle:hover { background: var(--text); color: var(--bg); }
    .theme-toggle svg { width: 20px; height: 20px; }
    /* 숫자와 메뉴를 서로 다른 높이에 두어 여백을 살린 대문. */
    .home-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(210px, .4fr); align-items: end; gap: 5vw; padding-block: clamp(64px, 12vh, 140px) clamp(48px, 9vh, 100px); }
    .home-title { display: flex; align-items: flex-start; justify-self: start; align-self: center; margin: 0; font-family: var(--font-mono); font-size: clamp(8rem, 27vw, 26rem); font-weight: 700; line-height: 1.1; letter-spacing: -.04em; }
    .digit-window { display: block; width: .6em; overflow: hidden; }
    .digit-window:nth-child(2) { margin-top: .14em; }
    .digit-window:nth-child(3) { margin-top: .035em; }
    .digit { display: block; transform-origin: center bottom; }
    .digit-outline { color: transparent; -webkit-text-stroke: 1.5px var(--text); }
    .landing-nav { display: grid; align-self: end; width: 100%; margin-bottom: 14px; }
    .landing-nav a { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 100px; padding: 24px 0; border-top: 1px solid var(--line); font-size: clamp(1.4rem, 2.6vw, 2.5rem); font-weight: 500; letter-spacing: -.045em; text-decoration: none; }
    .landing-nav a:last-child { border-bottom: 1px solid var(--line); }
    .landing-nav .nav-name { transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .landing-nav .arrow { font-weight: 400; font-size: .85em; line-height: 1; transition: transform .3s; }
    .landing-nav a:hover .nav-name, .landing-nav a:focus-visible .nav-name { transform: translateX(8px); }
    .landing-nav a:hover .arrow, .landing-nav a:focus-visible .arrow { transform: translate(4px, -4px); }
    /* 첫 진입 장막은 입력을 가리지 않고 CSS만으로도 종료된다. */
    .entry-curtain { display: none; }
    .intro-playing .entry-curtain { display: block; position: fixed; inset: 0; z-index: 50; overflow: hidden; pointer-events: none; animation: curtain-finish 0s 1.25s forwards; }
    .curtain-panel { position: absolute; inset-block: 0; width: calc(50% + 1px); background: var(--text); }
    .curtain-left { left: 0; animation: curtain-left 1.1s .12s cubic-bezier(.76,0,.24,1) both; }
    .curtain-right { right: 0; animation: curtain-right 1.1s .12s cubic-bezier(.76,0,.24,1) both; }
    .curtain-mark { position: absolute; inset: 0; display: grid; place-items: center; color: var(--bg); font: 1.1rem var(--font-mono); letter-spacing: .2em; animation: curtain-mark .25s .16s both; }
    .intro-playing .digit { animation: digit-enter .8s .35s cubic-bezier(.16,1,.3,1) both; }
    .intro-playing .digit-window:nth-child(2) .digit { animation-delay: .47s; }
    .intro-playing .digit-window:nth-child(3) .digit { animation-delay: .59s; }
    .intro-playing .landing-nav { animation: menu-enter .6s .75s both; }
    .intro-playing:focus-within .entry-curtain { display: none; }
    /* 메뉴를 고르면 페이지 이름을 담은 장막이 짧게 올라온다. */
    .nav-transition { display: none; position: fixed; inset: 0; z-index: 60; place-items: center; background: var(--text); color: var(--bg); pointer-events: none; }
    .nav-transition span { font-size: clamp(2.8rem, 8vw, 7rem); font-weight: 500; letter-spacing: -.055em; }
    .is-leaving .nav-transition { display: grid; animation: navigation-cover .45s cubic-bezier(.76,0,.24,1) both; }
    @keyframes curtain-left { to { transform: translateX(-101%); } }
    @keyframes curtain-right { to { transform: translateX(101%); } }
    @keyframes curtain-mark { to { opacity: 0; } }
    @keyframes curtain-finish { to { visibility: hidden; } }
    @keyframes digit-enter { from { transform: translateY(112%) rotate(7deg); } to { transform: translateY(0) rotate(0); } }
    @keyframes menu-enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes navigation-cover { from { transform: translateY(101%); border-radius: 32% 32% 0 0; } to { transform: translateY(0); border-radius: 0; } }
    @media (max-width: 800px) {
      .home-main { grid-template-columns: minmax(0, 1fr); align-content: space-between; gap: 52px; padding-block: 44px 48px; }
      .home-title { align-self: start; font-size: clamp(7.5rem, 44vw, 24rem); }
      .landing-nav { justify-self: end; width: min(82%, 360px); margin-bottom: 0; }
      .landing-nav a { min-height: 76px; padding-block: 20px; font-size: clamp(1.4rem, 4vw, 1.8rem); }
    }
    @media (max-width: 600px) { .site-header { min-height: 80px; } }
    @media (max-height: 650px) and (min-width: 801px) { .home-main { padding-block: 24px 36px; } .home-title { font-size: min(25vw, 52svh); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .intro-playing .entry-curtain, .is-leaving .nav-transition { display: none; }
      .digit, .landing-nav { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="entry-curtain" aria-hidden="true">
    <div class="curtain-panel curtain-left"></div>
    <div class="curtain-panel curtain-right"></div>
    <span class="curtain-mark">824</span>
  </div>
  <div class="nav-transition" aria-hidden="true"><span id="transitionName"></span></div>
  <div class="home">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="824 home">824</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg></button>
    </header>
    <main class="home-main" id="main">
      <h1 class="home-title" id="site-title" aria-label="824">
        <span class="digit-window" aria-hidden="true"><span class="digit">8</span></span>
        <span class="digit-window" aria-hidden="true"><span class="digit digit-outline">2</span></span>
        <span class="digit-window" aria-hidden="true"><span class="digit">4</span></span>
      </h1>
      <nav class="landing-nav" aria-label="Explore">
        <a href="profile.html"><span class="nav-name">Profile</span><span class="arrow" aria-hidden="true">↗</span></a>
        <a href="community.html"><span class="nav-name">Community</span><span class="arrow" aria-hidden="true">↗</span></a>
      </nav>
    </main>
  </div>
  <script>
    // 테마 저장에 실패하더라도 전환 기능은 유지한다.
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
      var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg>';
      function label() {
        var dark = root.getAttribute("data-theme") === "dark";
        toggle.innerHTML = dark ? sun : moon;
        toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        toggle.title = dark ? "Light theme" : "Dark theme";
      }
      label();
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      window.addEventListener("storage", function (event) {
        if (event.key === "theme" && (event.newValue === "dark" || event.newValue === "light")) {
          root.setAttribute("data-theme", event.newValue); label();
        }
      });
    })();

    // 애니메이션이 끝나면 장막 요소를 제거해 페이지 탐색을 단순하게 유지한다.
    (function () {
      var curtain = document.querySelector(".entry-curtain");
      function finishIntro() {
        document.documentElement.classList.remove("intro-playing");
        if (curtain) curtain.remove();
      }
      if (!document.documentElement.classList.contains("intro-playing")) finishIntro();
      else window.setTimeout(finishIntro, 1700);
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) finishIntro();
      });
    })();

    // 새 탭 열기와 키보드 탐색은 기본 링크 동작을 유지한다.
    (function () {
      var root = document.documentElement;
      var label = document.getElementById("transitionName");
      var timer;
      var recovery;
      var leaving = false;
      function reset() {
        clearTimeout(timer);
        clearTimeout(recovery);
        leaving = false;
        root.classList.remove("is-leaving");
      }
      document.querySelectorAll(".landing-nav a").forEach(function (link) {
        link.addEventListener("click", function (event) {
          if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute("download") || (link.target && link.target !== "_self")) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          event.preventDefault();
          if (leaving) return;
          leaving = true;
          label.textContent = link.querySelector(".nav-name").textContent;
          root.classList.add("is-leaving");
          timer = window.setTimeout(function () { window.location.assign(link.href); }, 470);
          recovery = window.setTimeout(reset, 2200);
        });
      });
      window.addEventListener("pageshow", reset);
      window.addEventListener("keydown", function (event) { if (event.key === "Escape" && leaving) reset(); });
    })();
  </script>
</body>
</html>
