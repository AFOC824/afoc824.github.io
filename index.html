<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // 저장소가 차단되어도 기본 테마로 화면을 표시한다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      // 모션 감소 설정에서는 장막 없이 바로 내용을 표시한다.
      if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("intro-playing");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <title>824 — OOO</title>
  <meta name="description" content="824 — the personal space of OOO. Profile and community.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="824 — OOO">
  <meta property="og:description" content="The personal space of OOO. Profile and community.">
  <style>
    /* 모든 페이지에서 같은 색상, 서체와 조작 방식을 사용한다. */
    :root {
      --bg: #f8f8f8; --surface: #eeeeee; --text: #181818;
      --muted: #626262; --faint: #707070; --line: #d5d5d5; --field: #ffffff;
 --shell: 1440px; --gutter: clamp(22px, 5vw, 80px);
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #141414; --surface: #202020; --text: #f2f2f2;
      --muted: #aaaaaa; --faint: #9b9b9b; --line: #3c3c3c; --field: #1b1b1b;

    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 17px; line-height: 1.65; font-feature-settings: "ss01"; }
    a { color: inherit; text-underline-offset: 5px; }
    button, input, textarea, select { font: inherit; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:disabled { cursor: wait; opacity: .55; }
    a, button { touch-action: manipulation; }
    button, input, textarea, select { border-radius: 0; }
    input, textarea, select { max-width: 100%; min-width: 0; color: var(--text); background: var(--field); }
    textarea { resize: vertical; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--text); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .shell { width: 100%; max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }
    .mono, .eyebrow { font-family: var(--font-mono); font-size: .88rem; font-weight: 400; letter-spacing: -.02em; }
    .eyebrow { text-transform: uppercase; color: var(--muted); }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 12px 20px; background: var(--text); color: var(--bg); transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .site-header { min-height: 104px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); }
    .wordmark { font-size: 1.7rem; font-weight: 750; letter-spacing: -.07em; text-decoration: none; }
    .header-note { margin-right: auto; color: var(--muted); }
    .site-nav { display: flex; align-items: center; gap: 30px; }
    .site-nav a { padding-block: 12px; text-decoration: none; font-size: .94rem; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { text-decoration: underline; }
    .theme-toggle { flex: 0 0 auto; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--text); transition: background .2s, color .2s, transform .2s; }
    .theme-toggle:hover { background: var(--text); color: var(--bg); transform: rotate(-12deg); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .site-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; border-top: 1px solid var(--line); padding-block: 26px; color: var(--muted); font-family: var(--font-mono); font-size: .88rem; }
    .site-footer a { padding-block: 10px; text-decoration: none; }
    .site-footer a:hover { color: var(--text); }
    .arrow { font-weight: 400; line-height: 1; }
    /* 본문은 기본으로 보이고, 스크립트가 정상 실행된 경우에만 모션을 더한다. */
    .reveal.in { animation: appear .65s cubic-bezier(.2,.8,.2,1) both; }
    .reveal.d1.in { animation-delay: .08s; }
    .reveal.d2.in { animation-delay: .16s; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }



    @media (max-width: 600px) {
      .site-header { min-height: 84px; gap: 16px; }
      .header-note { display: none; }
      .site-nav { gap: 18px; margin-left: auto; }
      .site-nav a { font-size: .9rem; }
      .site-footer { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal, .item { opacity: 1 !important; transform: none !important; }

    }

    /* 대문은 숫자와 두 개의 진입 링크만 중심에 둔다. */
    .home { display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; max-width: 1440px; }
    .site-header { min-height: 96px; border-bottom: 0; }
    .site-header .wordmark { font: .94rem var(--font-mono); letter-spacing: -.025em; }
    .home-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 0 72px; }
    .home-label { margin: 0 0 28px; color: var(--muted); font: .88rem var(--font-mono); letter-spacing: .02em; }
    .home-title { display: flex; margin: 0; font-family: var(--font-mono); font-size: clamp(7.5rem, 38vw, 30rem); font-weight: 700; line-height: 1.08; letter-spacing: -.04em; }
    .digit-window { display: block; width: .6em; overflow: hidden; }
    .digit { display: block; transform-origin: center bottom; }
    .digit-outline { color: transparent; -webkit-text-stroke: 1.5px var(--text); }
    .landing-nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; width: min(100%, 430px); margin-top: 48px; }
    .landing-nav a { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 1.15rem; text-decoration: none; transition: border-color .2s; }
    .landing-nav a:hover { border-bottom-color: var(--text); }
    .landing-nav .arrow { transition: transform .25s; }
    .landing-nav a:hover .arrow { transform: translate(3px, -3px); }
    .site-footer { min-height: 78px; padding-block: 16px; }
    /* 장막은 포인터 입력을 막지 않으며 CSS만으로도 자동 종료된다. */
    .entry-curtain { display: none; }
    .intro-playing .entry-curtain { display: block; position: fixed; inset: 0; z-index: 50; overflow: hidden; pointer-events: none; animation: curtain-finish 0s 1.25s forwards; }
    .curtain-panel { position: absolute; inset-block: 0; width: calc(50% + 1px); background: var(--text); }
    .curtain-left { left: 0; animation: curtain-left 1.1s .12s cubic-bezier(.76,0,.24,1) both; }
    .curtain-right { right: 0; animation: curtain-right 1.1s .12s cubic-bezier(.76,0,.24,1) both; }
    .curtain-mark { position: absolute; inset: 0; display: grid; place-items: center; color: var(--bg); font: 1.1rem var(--font-mono); letter-spacing: .2em; animation: curtain-mark .25s .16s both; }
    .intro-playing .digit { animation: digit-enter .8s .35s cubic-bezier(.16,1,.3,1) both; }
    .intro-playing .digit-window:nth-child(2) .digit { animation-delay: .47s; }
    .intro-playing .digit-window:nth-child(3) .digit { animation-delay: .59s; }
    .intro-playing .home-label, .intro-playing .landing-nav { animation: home-enter .6s .75s both; }
    .intro-playing:focus-within .entry-curtain { display: none; }
    @keyframes curtain-left { to { transform: translateX(-101%); } }
    @keyframes curtain-right { to { transform: translateX(101%); } }
    @keyframes curtain-mark { to { opacity: 0; } }
    @keyframes curtain-finish { to { visibility: hidden; } }
    @keyframes digit-enter { from { transform: translateY(112%) rotate(7deg); } to { transform: translateY(0) rotate(0); } }
    @keyframes home-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (max-width: 600px) {
      .site-header { min-height: 80px; }
      .home-main { padding-block: 44px 60px; }
      .home-label { margin-bottom: 22px; }
      .landing-nav { margin-top: 36px; gap: 26px; }
      .landing-nav a { font-size: 1rem; }
      .site-footer { min-height: 70px; }
    }
    @media (max-height: 800px) and (min-width: 601px) {
      .home-main { padding-block: 12px 28px; }
      .home-title { font-size: min(28vw, 48svh); }
      .home-label { margin-bottom: 8px; }
      .landing-nav { margin-top: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro-playing .entry-curtain { display: none; }
      .digit, .home-label, .landing-nav { opacity: 1 !important; transform: none !important; }
    }

  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="entry-curtain" aria-hidden="true">
    <div class="curtain-panel curtain-left"></div>
    <div class="curtain-panel curtain-right"></div>
    <span class="curtain-mark">824</span>
  </div>
  <div class="home shell">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="824 home">824 / OOO</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg></button>
    </header>
    <main class="home-main" id="main">
      <p class="home-label">A PERSONAL SPACE</p>
      <h1 class="home-title" id="site-title" aria-label="824">
        <span class="digit-window" aria-hidden="true"><span class="digit">8</span></span>
        <span class="digit-window" aria-hidden="true"><span class="digit digit-outline">2</span></span>
        <span class="digit-window" aria-hidden="true"><span class="digit">4</span></span>
      </h1>
      <nav class="landing-nav" aria-label="Explore">
        <a href="profile.html"><span>Profile</span><span class="arrow" aria-hidden="true">↗</span></a>
        <a href="community.html"><span>Community</span><span class="arrow" aria-hidden="true">↗</span></a>
      </nav>
    </main>
    <footer class="site-footer">
      <span>© 2026 OOO</span>
      <a href="https://github.com/afoc824" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </footer>
  </div>
  <script>
    // 테마 저장에 실패하더라도 전환 기능은 유지한다.
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
      var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg>';
      function label() {
        var dark = root.getAttribute("data-theme") === "dark";
        toggle.innerHTML = dark ? sun : moon;
        toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        toggle.title = dark ? "Light theme" : "Dark theme";
      }
      label();
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      window.addEventListener("storage", function (event) {
        if (event.key === "theme" && (event.newValue === "dark" || event.newValue === "light")) {
          root.setAttribute("data-theme", event.newValue); label();
        }
      });
    })();

    // 애니메이션이 끝나면 장막 요소를 제거해 페이지 탐색을 단순하게 유지한다.
    (function () {
      var curtain = document.querySelector(".entry-curtain");
      function finishIntro() {
        document.documentElement.classList.remove("intro-playing");
        if (curtain) curtain.remove();
      }
      if (!document.documentElement.classList.contains("intro-playing")) finishIntro();
      else window.setTimeout(finishIntro, 1700);
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) finishIntro();
      });
    })();
  </script>
</body>
</html>
