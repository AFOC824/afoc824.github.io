<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // 저장소가 차단되어도 기본 테마로 화면을 표시한다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <title>Ratings — 824</title>
  <meta name="description" content="Share something worth rating. Add stars and join the comments.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ratings — 824">
  <meta property="og:description" content="Share something worth rating. Add stars and join the comments.">
  <style>
    /* 모든 페이지에서 같은 색상과 서체를 사용한다. */
    :root {
      --bg: #f8f8f8; --surface: #eeeeee; --text: #181818;
      --muted: #444444; --faint: #595959; --line: #d5d5d5; --field: #ffffff;
      --shell: 1440px; --gutter: clamp(22px, 5vw, 80px);
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #141414; --surface: #202020; --text: #f2f2f2;
      --muted: #cccccc; --faint: #b5b5b5; --line: #3c3c3c; --field: #1b1b1b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 17px; font-weight: 450; line-height: 1.65; font-feature-settings: "ss01"; }
    a { color: inherit; text-underline-offset: 5px; }
    button, input, textarea, select { font: inherit; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:disabled { cursor: wait; opacity: .55; }
    a, button { touch-action: manipulation; }
    button, input, textarea, select { border-radius: 10px; }
    input, textarea, select { max-width: 100%; min-width: 0; color: var(--text); background: var(--field); }
    textarea { resize: vertical; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--text); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .mono, .eyebrow { font-family: var(--font-mono); font-size: .88rem; font-weight: 400; letter-spacing: -.02em; }
    .eyebrow { text-transform: uppercase; color: var(--muted); }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 12px 20px; background: var(--text); color: var(--bg); transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .theme-toggle { flex: 0 0 auto; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--text); transition: background .2s, color .2s, transform .2s; }
    .theme-toggle:hover { background: var(--text); color: var(--bg); transform: rotate(-12deg); }
    .theme-toggle svg { width: 20px; height: 20px; }
    /* 본문은 기본으로 보이고, 스크립트가 정상 실행된 경우에만 모션을 더한다. */
    .reveal.in { animation: appear .65s cubic-bezier(.2,.8,.2,1) both; }
    .reveal.d1.in { animation-delay: .08s; }
    .reveal.d2.in { animation-delay: .16s; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
    }
    /* 본문을 가운데 놓고, 페이지 이동은 상단의 간단한 링크로 제공한다. */
    .page-shell { max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }
    .page-header { display: flex; align-items: center; gap: 24px; min-height: 96px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; min-height: 46px; font: .94rem var(--font-mono); font-weight: 600; letter-spacing: -.06em; text-decoration: none; }
    .brand:hover { text-decoration: underline; }
    .page-nav { display: flex; align-items: center; gap: 24px; margin-left: auto; }
    .page-nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; font: .94rem var(--font-mono); text-decoration: none; }
    .page-nav a:hover { text-decoration: underline; }
    .content { width: 100%; max-width: 1000px; margin-inline: auto; padding-block: 56px 80px; min-width: 0; }
    .content-end { border-top: 1px solid var(--line); padding-top: 20px; }
    .content-end a { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; font-size: 1rem; font-weight: 400; color: var(--muted); letter-spacing: 0; line-height: 1.3; }
    .content-end a:hover { color: var(--text); text-decoration: underline; }
    @media (max-width: 600px) {
      .page-header { min-height: 80px; gap: 16px; }
      .page-nav { gap: 16px; }
      .content { padding-block: 40px 56px; }
    }
    .section { padding-bottom: 64px; min-width: 0; }
    .section-head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
    .section-symbol { flex: 0 0 auto; width: 30px; height: 30px; }
    .section-head h1 { margin: 0; font-weight: 500; font-size: clamp(2.7rem, 4.8vw, 4.5rem); letter-spacing: -.055em; line-height: 1.1; overflow-wrap: anywhere; }
    .section-note { margin: 0 0 38px; max-width: 54ch; font-size: 1.1rem; color: var(--text); }
    .form { background: var(--surface); border-radius: 16px; padding: 28px; margin-bottom: 42px; }
    .form-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
    .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .field > span { font-size: .88rem; color: var(--muted); font-family: var(--font-mono); }
    .form .grow { flex: 1 1 180px; }
    .form input[type="text"], .form textarea, .form select, .sub-form input, .rating-browser input, .rating-browser select {
      width: 100%; min-height: 48px; font: inherit; padding: 12px 14px; border: 1px solid var(--line); background: var(--field); color: var(--text); transition: border-color .2s;
    }
    .form input:focus, .form textarea:focus, .form select:focus, .sub-form input:focus, .rating-browser input:focus, .rating-browser select:focus { border-color: var(--text); }
    .form input::placeholder, .form textarea::placeholder, .sub-form input::placeholder, .rating-browser input::placeholder { color: var(--faint); opacity: 1; }
    .form textarea { min-height: 142px; line-height: 1.65; resize: vertical; }
    .form select { min-width: 110px; padding-right: 8px; }
    .form button[type="submit"], .sub-form button[type="submit"] { min-height: 48px; padding: 12px 28px; border: 1px solid var(--text); background: var(--text); color: var(--bg); font: .94rem var(--font-mono); transition: background .2s, color .2s; }
    .form button[type="submit"]:hover:not(:disabled), .sub-form button[type="submit"]:hover:not(:disabled) { background: var(--bg); color: var(--text); }
    .form .notice { margin: 12px 0 0; font-size: .88rem; color: var(--muted); }
    .notice:empty { display: none; }
    .rating-form-options .field { flex: 0 1 180px; }
    .rating-form-options .rating-field { flex: 1 1 240px; }
    .rating-browser { margin-bottom: 26px; }
    .category-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .category-filter { min-height: 44px; padding: 9px 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: .88rem var(--font-mono); }
    .category-filter:hover { border-color: var(--text); }
    .category-filter[aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--bg); font-weight: 500; }
    .browse-controls { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: end; }
    .browse-summary { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; margin-top: 16px; color: var(--muted); font-size: .88rem; }
    .browse-summary p { margin: 0; }
    .empty { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 140px; margin: 0; padding: 24px; text-align: center; border-radius: 12px; background: var(--surface); color: var(--muted); font: .94rem/1.6 var(--font-mono); }
    .rating-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 22px; align-items: start; }
    .board-list .empty, .guest-wall .empty, .rating-rail .empty { grid-column: 1 / -1; }
    .chip { padding: 26px; min-width: 0; background: var(--field); border: 1px solid var(--line); border-radius: 16px; overflow-wrap: anywhere; }
    .board-list .card:first-child { grid-column: 1 / -1; padding: 32px; }
    .card .head, .note .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 16px; }
    .who { font-weight: 600; font-size: 1rem; }
    .when { margin-left: auto; font: .88rem var(--font-mono); color: var(--muted); }
    .msg { margin: 0; font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .board-list .card:first-child .msg { font-size: 1.4rem; line-height: 1.6; letter-spacing: -.015em; }
    .chip .head { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .chip .name { margin: 0; font-size: 1.6rem; font-weight: 550; line-height: 1.2; letter-spacing: -.035em; }
    .chip .category { font: .88rem var(--font-mono); color: var(--muted); }
    .stars { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 1.25rem; }
    .star-icons { display: inline-flex; white-space: nowrap; }
    .star-mark { display: block; width: 22px; height: 22px; overflow: visible; }
    .star-value { font: .88rem var(--font-mono); white-space: nowrap; }
    .star-picker { width: 240px; max-width: 100%; }
    .star-pick-track { position: relative; width: 240px; height: 48px; border-radius: 8px; }
    .star-pick-art { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 48px); align-items: center; justify-items: center; pointer-events: none; }
    .star-pick-art .star-mark { width: 40px; height: 40px; }
    .star-pick-options { position: relative; display: flex; width: 240px; height: 48px; }
    .star-choice { flex: 0 0 24px; width: 24px; height: 48px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text); }
    .star-choice:focus-visible { outline-offset: 0; }
    .star-pick-track[aria-invalid="true"] { outline: 1px solid var(--text); outline-offset: 3px; }
    .star-readout { margin: 6px 0 0; color: var(--muted); font: .88rem/1.5 var(--font-mono); }
    .star-hint { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
    .chip .author { font: .88rem var(--font-mono); color: var(--muted); }
    .chip-toggle { display: block; min-height: 48px; margin-top: 16px; padding: 10px 0; text-align: left; font: .88rem var(--font-mono); background: none; color: var(--text); border: 0; text-decoration: underline; text-underline-offset: 5px; }
    .chip-more { display: none; }
    .chip.open .chip-more { display: block; }
    .sub-form { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); margin: 6px 0 22px; }
    .sub-form input { flex: 1 1 140px; font-size: 17px; }
    .sub-form .star-picker { flex: 0 0 240px; margin-bottom: 6px; }
    .sub-form button[type="submit"] { font-size: .88rem; padding-inline: 20px; }
    .sub-list .comment { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 1rem; }
    .sub-list .comment .stars { font-size: 1rem; color: var(--muted); }
    .sub-list .comment .text { overflow-wrap: anywhere; }
    .pop.in { animation: appear .5s ease both; }
    @media (max-width: 600px) {
      .board-list, .guest-wall, .rating-rail { grid-template-columns: 1fr; }
      .form-row { gap: 18px; }
      .form { padding: 18px 16px; }
      .form .grow { flex-basis: 100%; }
      .browse-controls { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .rating-form-options .field { flex: 1 1 120px; }
      .rating-form-options .rating-field { flex-basis: 100%; }
      .form textarea { min-height: 160px; }
      .chip { padding: 20px 16px; }
      .board-list .card:first-child .msg { font-size: 1.15rem; }
      .when { margin-left: 0; }
      .section-head h1 { font-size: 2.9rem; }
    }
    .no-script { margin: 0 0 28px; padding: 22px; border: 1px solid var(--line); color: var(--muted); }

    /* 커뮤니티 입구와 돌아가기 링크에 같은 장막 전환을 적용한다. */
    .nav-transition { display: none; position: fixed; inset: 0; z-index: 60; place-items: center; background: var(--text); color: var(--bg); pointer-events: none; }
    .nav-transition span { font-size: clamp(2.8rem, 8vw, 7rem); font-weight: 500; letter-spacing: -.055em; }
    .is-leaving .nav-transition { display: grid; animation: community-cover .45s cubic-bezier(.76,0,.24,1) both; }
    @keyframes community-cover { from { transform: translateY(101%); border-radius: 32% 32% 0 0; } to { transform: translateY(0); border-radius: 0; } }
    @media (prefers-reduced-motion: reduce) { .is-leaving .nav-transition { display: none; } }

    /* 목록, 작성, 완료는 한 번에 한 화면만 보여준다. */
    .section { min-height: min(620px, 72svh); }
    .browse-actions { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
    .browse-actions .section-note { max-width: 46ch; margin: 0; }
    .flow-button { display: inline-flex; align-items: center; justify-content: center; gap: 22px; flex-shrink: 0; min-height: 48px; padding: 12px 22px; border: 1px solid var(--text); border-radius: 999px; background: var(--text); color: var(--bg); font-size: 1rem; line-height: 1.4; text-decoration: none; transition: transform .2s, background .2s, color .2s; }
    .flow-button:hover { transform: translateY(-2px); background: var(--bg); color: var(--text); }
    .flow-button span { transition: transform .2s; }
    .flow-button:hover span { transform: translate(2px, -2px); }
    .flow-back { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; margin: 0 0 24px; padding: 0; background: none; border: 0; border-radius: 0; color: var(--muted); font-size: .94rem; }
    .flow-back:hover { color: var(--text); text-decoration: underline; text-underline-offset: 5px; }
    #composeView { max-width: 760px; margin-inline: auto; }
    .flow-view h2 { margin: 0 0 28px; font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 500; letter-spacing: -.045em; line-height: 1.2; overflow-wrap: anywhere; }
    #composeView .form { margin-bottom: 0; }
    .flow-connection { margin: -8px 0 24px; color: var(--muted); font-size: .94rem; }
    #successView { max-width: 760px; margin-inline: auto; padding-block: clamp(28px, 7vh, 80px); }
    .success-mark { width: 64px; height: 64px; margin-bottom: 30px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    #successView h2 { margin-bottom: 14px; }
    #successView p { margin: 0; max-width: 45ch; font-size: 1.1rem; }
    .success-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 32px; }
    .success-actions [data-compose-again] { background: transparent; border-color: var(--line); color: var(--text); }
    .success-actions [data-compose-again]:hover { border-color: var(--text); }
    .flow-view.is-exiting { animation: flow-out .15s ease-in both; }
    .flow-view.is-entering { animation: flow-in .38s cubic-bezier(.2,.8,.2,1) both; }
    #successView.is-entering .success-mark { animation: mark-in .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes flow-out { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes flow-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes mark-in { from { opacity: 0; transform: translateY(8px) rotate(-12deg) scale(.9); } to { opacity: 1; transform: none; } }
    @media (max-width: 600px) {
      .browse-actions { flex-direction: column; gap: 20px; margin-bottom: 28px; }
      .flow-view h2 { margin-bottom: 24px; }
      .flow-back { margin-bottom: 20px; }
      .success-actions { align-items: stretch; flex-direction: column; }
      .success-actions .flow-button { width: fit-content; max-width: 100%; }
    }
  </style>
  <noscript><style>.form, .data-list, .rating-browser { display: none; }</style></noscript>
</head>
<body>
  <div class="nav-transition" aria-hidden="true"><span id="transitionName"></span></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-shell">
    <header class="page-header">
      <a class="brand" href="index.html" aria-label="824 home">824.</a>
      <nav class="page-nav" aria-label="Page navigation">
        <a href="community.html"><span aria-hidden="true">←</span> Community</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg></button>
    </header>

    <main class="content" id="main">
      <noscript>
        <p class="no-script" role="status">Enable JavaScript to load ratings and comments and add your own. You can still explore every page using the links.</p>
      </noscript>

      <!-- 평점 전용 본문 -->
      <section class="section" id="ratings" aria-labelledby="section-title">
        <header class="section-head">
          <h1 id="section-title">Ratings</h1>
          <svg class="section-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" aria-hidden="true"><path d="m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9Z"/></svg>
        </header>
        <div class="flow-view" id="browseView">
          <div class="browse-actions">
            <p class="section-note">Movies, meals, music, and more. Share a favorite and give it a score — half stars welcome.</p>
            <button class="flow-button" type="button" data-open-compose hidden>Add a rating <span aria-hidden="true">↗</span></button>
          </div>

          <div class="rating-browser" role="search" aria-label="Find ratings">
            <div class="category-filters" id="categoryFilters" role="group" aria-label="Filter by category">
              <button class="category-filter" type="button" data-category="Movies" aria-pressed="true">Movies</button>
              <button class="category-filter" type="button" data-category="TV" aria-pressed="false">TV</button>
              <button class="category-filter" type="button" data-category="Restaurants" aria-pressed="false">Restaurants</button>
              <button class="category-filter" type="button" data-category="Books" aria-pressed="false">Books</button>
              <button class="category-filter" type="button" data-category="Music" aria-pressed="false">Music</button>
            </div>
            <div class="browse-controls">
              <label class="field" for="ratingSearch"><span>Search titles</span><input type="search" id="ratingSearch" placeholder="Find an item" maxlength="100" autocomplete="off"></label>
              <label class="field" for="ratingSort"><span>Sort by</span><select id="ratingSort">
                <option value="newest">Newest first</option>
                <option value="highest">Highest score</option>
              </select></label>
            </div>
            <div class="browse-summary">
              <p id="ratingResults" role="status" aria-live="polite">Loading items…</p>
              <p>Scores are each item's original rating.</p>
            </div>
          </div>

          <div class="rail-wrap">
            <div class="rating-rail data-list" id="ratingList">
              <p class="empty" role="status">Loading…</p>
            </div>
          </div>
        </div>

        <div class="flow-view" id="composeView" hidden>
          <button class="flow-back" type="button" data-show-browse><span aria-hidden="true">←</span> Back to ratings</button>
          <h2 tabindex="-1">Add a rating</h2>
          <form class="form" id="ratingForm">
            <div class="form-row">
              <label class="field grow" for="ratingAuthor"><span>Your name</span><input type="text" id="ratingAuthor" maxlength="20" placeholder="Your name" autocomplete="nickname" required></label>
              <label class="field grow" for="ratingName"><span>What are you rating?</span><input type="text" id="ratingName" maxlength="60" placeholder="Item name" required></label>
            </div>
            <div class="form-row rating-form-options">
              <label class="field" for="ratingCategory"><span>Category</span><select id="ratingCategory">
                <option value="Movies">Movies</option>
                <option value="TV">TV</option>
                <option value="Restaurants">Restaurants</option>
                <option value="Books">Books</option>
                <option value="Music">Music</option>
              </select></label>
              <div class="field rating-field"><span>Your rating</span><div class="star-picker" id="ratingStars"></div></div>
              <button type="submit" id="ratingButton" disabled>Add</button>
            </div>
            <p class="notice" id="ratingStatus" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="flow-view" id="successView" hidden>
          <svg class="success-mark" width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="28" cy="28" r="25"/><path d="m17 28 7 7 15-15" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2 tabindex="-1">Thanks for sharing.</h2>
          <p data-success-message></p>
          <div class="success-actions">
            <button class="flow-button" type="button" data-show-browse>Browse ratings <span aria-hidden="true">↗</span></button>
            <button class="flow-button" type="button" data-compose-again>Add another</button>
          </div>
        </div>
      </section>

      <div class="content-end"><a href="community.html"><span>Back to community.</span><span aria-hidden="true">↗</span></a></div>
    </main>
  </div>

  <script type="module">
    // 외부 파일을 불러오지 못해도 안내 문구와 페이지 탐색은 유지한다.
    async function initializeRatings() {
    const [appModule, firestoreModule] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js")
    ]);
    const { initializeApp } = appModule;
    const {
      getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp
    } = firestoreModule;

    const firebaseConfig = {
      apiKey: "AIzaSyCiuEisvgKaSyMAP4hLM5qk_L94oK6oyP4",
      authDomain: "afoc824-52dad.firebaseapp.com",
      projectId: "afoc824-52dad",
      storageBucket: "afoc824-52dad.firebasestorage.app",
      messagingSenderId: "638791232483",
      appId: "1:638791232483:web:0b8bb7e968c985face8ed6"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const categories = new Set(["Movies", "TV", "Restaurants", "Books", "Music"]);

    // 기존 정수 별점도 유지하며, 허용된 반점 단위만 읽고 저장한다.
    function ratingValue(value) {
      if (typeof value !== "number" && typeof value !== "string") return null;
      const n = Number(value);
      return Number.isFinite(n) && n >= 0.5 && n <= 5 && Number.isInteger(n * 2) ? n : null;
    }

    function itemCategory(value) {
      return categories.has(value) ? value : null;
    }

    // 같은 SVG 윤곽을 읽기 전용 별점과 입력창에 사용해 반쪽 위치를 맞춘다.
    function makeStar() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      svg.classList.add("star-mark");
      const shape = "m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9Z";
      const fill = document.createElementNS(ns, "path");
      fill.setAttribute("d", shape);
      fill.setAttribute("fill", "currentColor");
      fill.classList.add("star-fill");
      const outline = document.createElementNS(ns, "path");
      outline.setAttribute("d", shape);
      outline.setAttribute("fill", "none");
      outline.setAttribute("stroke", "currentColor");
      outline.setAttribute("stroke-width", "1.3");
      outline.setAttribute("stroke-linejoin", "round");
      svg.append(fill, outline);
      paintStar(svg, 0);
      return svg;
    }

    function paintStar(svg, fill) {
      const fraction = Math.max(0, Math.min(1, fill));
      svg.querySelector(".star-fill").style.clipPath = "inset(0 " + (1 - fraction) * 100 + "% 0 0)";
      svg.classList.toggle("star-half", fraction === 0.5);
      svg.dataset.fill = String(fraction);
    }

    function labelStars(element, value) {
      const rating = ratingValue(value);
      element.replaceChildren();
      element.setAttribute("role", "img");
      element.setAttribute("aria-label", rating === null ? "No valid rating" : rating.toFixed(1) + " out of 5 stars");
      const icons = document.createElement("span");
      icons.className = "star-icons";
      icons.setAttribute("aria-hidden", "true");
      for (let i = 0; i < 5; i++) {
        const star = makeStar();
        paintStar(star, (rating === null ? 0 : rating) - i);
        icons.appendChild(star);
      }
      const number = document.createElement("span");
      number.className = "star-value";
      number.setAttribute("aria-hidden", "true");
      number.textContent = rating === null ? "Not rated" : rating.toFixed(1) + " / 5";
      element.append(icons, number);
    }

    let pickerCount = 0;

    // 별의 좌우 절반을 각각 터치할 수 있으며, 미리보기와 확정값은 분리한다.
    function createStarPicker(container, label) {
      let selected = null;
      const track = document.createElement("div");
      track.className = "star-pick-track";
      track.setAttribute("role", "radiogroup");
      track.setAttribute("aria-label", label);
      track.setAttribute("aria-required", "true");
      const art = document.createElement("div");
      art.className = "star-pick-art";
      art.setAttribute("aria-hidden", "true");
      const icons = Array.from({ length: 5 }, function () {
        const star = makeStar();
        art.appendChild(star);
        return star;
      });
      const options = document.createElement("div");
      options.className = "star-pick-options";
      const readout = document.createElement("p");
      readout.className = "star-readout";
      readout.setAttribute("aria-hidden", "true");
      const hint = document.createElement("p");
      hint.className = "star-hint";
      hint.id = "star-hint-" + (++pickerCount);
      hint.textContent = "Choose a star. Half stars count too.";
      track.setAttribute("aria-describedby", hint.id);
      const choices = [];

      function paint(value) {
        icons.forEach(function (star, i) { paintStar(star, (value || 0) - i); });
        readout.textContent = value === null ? "Not selected" : value.toFixed(1) + " / 5";
      }

      function commit(value) {
        const valid = ratingValue(value);
        if (valid === null) return;
        selected = valid;
        container.dataset.value = String(valid);
        track.removeAttribute("aria-invalid");
        choices.forEach(function (choice) {
          const checked = Number(choice.dataset.value) === valid;
          choice.setAttribute("aria-checked", String(checked));
          choice.tabIndex = checked ? 0 : -1;
        });
        paint(valid);
      }

      for (let i = 0; i < 10; i++) {
        const value = (i + 1) / 2;
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "star-choice";
        choice.dataset.value = String(value);
        choice.setAttribute("role", "radio");
        choice.setAttribute("aria-label", value.toFixed(1) + " out of 5 stars");
        choice.setAttribute("aria-checked", "false");
        choice.tabIndex = i === 0 ? 0 : -1;
        choice.addEventListener("pointerenter", function (event) {
          if (event.pointerType === "mouse" || event.pointerType === "pen") paint(value);
        });
        choice.addEventListener("click", function () { commit(value); });
        choice.addEventListener("keydown", function (event) {
          let next;
          if (event.key === "ArrowRight" || event.key === "ArrowUp") next = (i + 1) % 10;
          else if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = (i + 9) % 10;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = 9;
          else return;
          event.preventDefault();
          commit((next + 1) / 2);
          choices[next].focus({ preventScroll: true });
        });
        choices.push(choice);
        options.appendChild(choice);
      }
      track.addEventListener("pointerleave", function () { paint(selected); });
      track.addEventListener("focusout", function (event) {
        if (!track.contains(event.relatedTarget)) paint(selected);
      });
      track.append(art, options);
      container.replaceChildren(track, readout, hint);
      container.dataset.value = "";
      paint(null);
      return {
        value: function () { return selected; },
        reset: function () {
          selected = null;
          container.dataset.value = "";
          track.removeAttribute("aria-invalid");
          choices.forEach(function (choice, index) {
            choice.setAttribute("aria-checked", "false");
            choice.tabIndex = index === 0 ? 0 : -1;
          });
          paint(null);
        },
        label: function (text) { track.setAttribute("aria-label", text); },
        requestSelection: function () {
          track.setAttribute("aria-invalid", "true");
          choices.find(function (choice) { return choice.tabIndex === 0; }).focus({ preventScroll: true });
        }
      };
    }

    function showEmpty(box, msg) {
      const p = document.createElement("p");
      p.className = "empty";
      p.setAttribute("role", "status");
      p.textContent = msg;
      box.replaceChildren(p);
    }

    function itemTime(value) {
      try {
        const time = value && typeof value.toMillis === "function" ? value.toMillis()
          : value && typeof value.toDate === "function" ? value.toDate().getTime() : 0;
        return Number.isFinite(time) ? time : 0;
      } catch (error) { return 0; }
    }

    // 카드를 붙인 다음 프레임에서 순차 등장 모션을 시작한다.
    function popIn(el, index) {
      if (reduceMotion) { el.classList.add("pop", "in"); return; }
      el.classList.add("pop");
      el.style.animationDelay = Math.min(index * 70, 480) + "ms";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { el.classList.add("in"); });
      });
    }

    const authorInput = document.querySelector("#ratingAuthor");
    const nameInput = document.querySelector("#ratingName");
    const categoryInput = document.querySelector("#ratingCategory");
    const mainPicker = createStarPicker(document.querySelector("#ratingStars"), "Your rating");
    const button = document.querySelector("#ratingButton");
    const list = document.querySelector("#ratingList");
    const status = document.querySelector("#ratingStatus");
    const categoryButtons = document.querySelectorAll("#categoryFilters [data-category]");
    const searchInput = document.querySelector("#ratingSearch");
    const sortInput = document.querySelector("#ratingSort");
    const results = document.querySelector("#ratingResults");

    // 카드를 재사용해서 필터나 정렬 중에도 작성 중인 댓글을 잃지 않는다.
    const views = new Map();
    let loaded = false;
    let activeCategory = "Movies";

    function setCategory(value) {
      activeCategory = categories.has(value) ? value : "Movies";
      categoryButtons.forEach(function (button) {
        button.setAttribute("aria-pressed", String(button.dataset.category === activeCategory));
      });
    }

    function renderItems() {
      if (!loaded) return;
      const focused = list.contains(document.activeElement) ? document.activeElement : null;
      const selection = focused && typeof focused.selectionStart === "number"
        ? [focused.selectionStart, focused.selectionEnd] : null;
      const search = searchInput.value.trim().toLocaleLowerCase();
      const items = Array.from(views.values());
      items.sort(function (a, b) {
        if (sortInput.value === "highest") {
          const scoreDifference = (ratingValue(b.data.stars) ?? -1) - (ratingValue(a.data.stars) ?? -1);
          if (scoreDifference) return scoreDifference;
        }
        return itemTime(b.data.createdAt) - itemTime(a.data.createdAt) || a.id.localeCompare(b.id);
      });

      list.querySelectorAll(".empty").forEach(function (element) {
        if (element.parentElement === list) element.remove();
      });
      let nextNode = list.firstElementChild;
      let visibleCount = 0;
      items.forEach(function (view) {
        const visible = itemCategory(view.data.category) === activeCategory
          && view.title.textContent.toLocaleLowerCase().includes(search);
        view.node.hidden = !visible;
        if (visible) visibleCount++;
        if (view.node === nextNode) nextNode = nextNode.nextElementSibling;
        else list.insertBefore(view.node, nextNode);
      });
      results.textContent = visibleCount === items.length
        ? visibleCount + (visibleCount === 1 ? " item" : " items")
        : visibleCount + " of " + items.length + " items";

      if (!visibleCount) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = items.length ? "No matches. Try another title or category." : "No items yet. Add something worth rating.";
        list.appendChild(empty);
      }
      if (focused && focused.isConnected && !focused.closest("[hidden]") && document.activeElement !== focused) {
        focused.focus({ preventScroll: true });
        if (selection) focused.setSelectionRange(selection[0], selection[1]);
      }
    }

    categoryButtons.forEach(function (button) {
      button.addEventListener("click", function () { setCategory(button.dataset.category); renderItems(); });
    });
    searchInput.addEventListener("input", renderItems);
    sortInput.addEventListener("change", renderItems);

    document.querySelector("#ratingForm").onsubmit = async function (event) {
      event.preventDefault();
      if (button.disabled) return;
      const author = authorInput.value.trim();
      const name = nameInput.value.trim();
      const category = categoryInput.value;
      const rating = ratingValue(mainPicker.value());

      if (!author || !name) { alert("Please fill in both your name and the item name."); return; }
      if (author.length > 20 || name.length > 60) {
        alert("Your name can be up to 20 characters, item name up to 60."); return;
      }
      if (!categories.has(category)) {
        status.textContent = "Choose a category from the list."; return;
      }
      if (rating === null) {
        status.textContent = "Choose a star rating before adding your item.";
        mainPicker.requestSelection(); return;
      }

      button.disabled = true;
      button.textContent = "Adding…";
      status.textContent = "Saving your item…";
      let saved = false;
      // 저장이 끝나기 전에 새 입력이 이전 요청에 의해 지워지지 않도록 잠근다.
      const controls = Array.from(this.querySelectorAll("input, textarea, select, .star-choice"), function (control) {
        return { element: control, disabled: control.disabled };
      });
      controls.forEach(function (control) { control.element.disabled = true; });
      try {
        await addDoc(collection(db, "ratings"), {
          author: author, name: name, category: category, stars: rating, createdAt: serverTimestamp()
        });
        authorInput.value = "";
        nameInput.value = "";
        mainPicker.reset();
        setCategory(category);
        searchInput.value = "";
        sortInput.value = "newest";
        renderItems();
        status.textContent = "Your item is now live in " + category + ".";
        saved = true;
      } catch (err) {
        status.textContent = "Couldn't save your item. Your text is still here; please try again.";
        console.error(err);
      }
      controls.forEach(function (control) { control.element.disabled = control.disabled; });
      button.disabled = false;
      button.textContent = "Add";
      if (saved) {
        document.dispatchEvent(new CustomEvent("community:saved", {
          detail: { message: "Your rating is now part of the collection." }
        }));
      }
    };

    function createItemView(itemId) {
      const chip = document.createElement("article");
      chip.className = "chip";
      const head = document.createElement("div");
      head.className = "head";
      const category = document.createElement("span");
      category.className = "category";
      const name = document.createElement("h2");
      name.className = "name";
      const stars = document.createElement("span");
      stars.className = "stars";
      const author = document.createElement("span");
      author.className = "author";
      head.append(category, name, stars, author);
      chip.appendChild(head);

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "chip-toggle";
      toggle.textContent = "Rate & comment ↓";
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-controls", "comments-" + itemId);
      chip.appendChild(toggle);

      const more = document.createElement("div");
      more.className = "chip-more";
      more.id = "comments-" + itemId;
      more.hidden = true;
      chip.appendChild(more);

      const subForm = document.createElement("form");
      subForm.className = "sub-form";
      const subRating = document.createElement("div");
      subRating.className = "star-picker";
      const subPicker = createStarPicker(subRating, "Your rating for this item");
      const subInput = document.createElement("input");
      subInput.type = "text";
      subInput.maxLength = 200;
      subInput.placeholder = "One-line comment";
      subInput.required = true;
      const subButton = document.createElement("button");
      subButton.type = "submit";
      subButton.textContent = "Post";
      subForm.append(subRating, subInput, subButton);
      more.appendChild(subForm);

      const subStatus = document.createElement("p");
      subStatus.className = "notice";
      subStatus.setAttribute("role", "status");
      more.appendChild(subStatus);
      const subList = document.createElement("div");
      subList.className = "sub-list";
      more.appendChild(subList);
      let unsubscribe = null;

      // 댓글은 사용자가 항목을 열 때 불러오며, 닫거나 정렬해도 입력값은 보존한다.
      function loadComments() {
        if (unsubscribe) return;
        showEmpty(subList, "Loading comments…");
        unsubscribe = onSnapshot(
          query(collection(db, "ratings", itemId, "comments"), orderBy("createdAt", "desc"), limit(50)),
          function (snap) {
            subList.replaceChildren();
            if (snap.empty) { showEmpty(subList, "No comments yet."); return; }
            snap.forEach(function (comment) {
              const data = comment.data() || {};
              const row = document.createElement("div");
              row.className = "comment";
              const score = document.createElement("span");
              score.className = "stars";
              labelStars(score, data.stars);
              const text = document.createElement("span");
              text.className = "text";
              text.textContent = typeof data.text === "string" ? data.text : "";
              row.append(score, text);
              subList.appendChild(row);
            });
          },
          function (err) { showEmpty(subList, "Couldn't load comments. Please reload to try again."); console.error(err); }
        );
      }

      toggle.onclick = function () {
        const open = chip.classList.toggle("open");
        toggle.textContent = open ? "Hide ↑" : "Rate & comment ↓";
        toggle.setAttribute("aria-expanded", String(open));
        more.hidden = !open;
        if (open) loadComments();
      };

      subForm.onsubmit = async function (event) {
        event.preventDefault();
        if (subButton.disabled) return;
        const text = subInput.value.trim();
        const rating = ratingValue(subPicker.value());
        if (!text) { alert("Please enter a comment."); return; }
        if (text.length > 200) { alert("Comments can be up to 200 characters."); return; }
        if (rating === null) {
          subStatus.textContent = "Choose a star rating before posting your comment.";
          subPicker.requestSelection(); return;
        }

        subButton.disabled = true;
        subButton.textContent = "Posting…";
        subStatus.textContent = "Saving your comment…";
        try {
          await addDoc(collection(db, "ratings", itemId, "comments"), {
            stars: rating, text: text, createdAt: serverTimestamp()
          });
          subInput.value = "";
          subStatus.textContent = "Your comment is now live.";
          subInput.focus();
        } catch (err) {
          subStatus.textContent = "Couldn't save your comment. Please try again.";
          console.error(err);
        }
        subButton.disabled = false;
        subButton.textContent = "Post";
      };

      return {
        id: itemId, node: chip, title: name, data: {},
        update: function (data) {
          this.data = data;
          name.textContent = typeof data.name === "string" && data.name.trim() ? data.name : "Untitled";
          category.textContent = itemCategory(data.category);
          labelStars(stars, data.stars);
          author.textContent = typeof data.author === "string" && data.author ? "by " + data.author : "";
          subPicker.label("Your rating for " + name.textContent);
          subInput.setAttribute("aria-label", "Comment on " + name.textContent);
        },
        destroy: function () {
          if (unsubscribe) unsubscribe();
          chip.remove();
        }
      };
    }

    // 모든 항목에서 분류·검색·정렬하므로 이전의 최근 30개 제한을 적용하지 않는다.
    onSnapshot(
      collection(db, "ratings"),
      function (snap) {
        const currentIds = new Set();
        let added = 0;
        snap.forEach(function (docSnap) {
          const data = docSnap.data() || {};
          // 현재 공개하는 분류만 표시한다. 제외된 항목은 데이터베이스에서 삭제하지 않는다.
          if (!categories.has(data.category)) return;
          const id = docSnap.id;
          currentIds.add(id);
          let view = views.get(id);
          if (!view) {
            view = createItemView(id);
            views.set(id, view);
            popIn(view.node, added++);
          }
          view.update(data);
        });
        views.forEach(function (view, id) {
          if (!currentIds.has(id)) { view.destroy(); views.delete(id); }
        });
        loaded = true;
        renderItems();
      },
      function (err) {
        views.forEach(function (view) { view.destroy(); });
        views.clear();
        loaded = false;
        results.textContent = "Items unavailable";
        showEmpty(list, "Couldn't load ratings. Please reload to try again.");
        console.error(err);
      }
    );

    document.querySelectorAll(".form button[type='submit']").forEach(function (button) {
      button.disabled = false;
    });
    }

    initializeRatings().catch(function (error) {
      document.querySelector("#ratingResults").textContent = "Items unavailable";
      document.querySelectorAll("#ratingList").forEach(function (list) {
        const message = document.createElement("p");
        message.className = "empty";
        message.setAttribute("role", "status");
        message.textContent = "Ratings is unavailable right now. Check your connection and reload to try again.";
        list.replaceChildren(message);
      });
      console.error("Ratings initialization failed:", error);
    });
  </script>

  <script>
    // 테마 저장에 실패하더라도 전환 기능은 유지한다.
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
      var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg>';
      function label() {
        var dark = root.getAttribute("data-theme") === "dark";
        toggle.innerHTML = dark ? sun : moon;
        toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        toggle.title = dark ? "Light theme" : "Dark theme";
      }
      toggle.hidden = false;
      label();
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      window.addEventListener("storage", function (event) {
        if (event.key === "theme" && (event.newValue === "dark" || event.newValue === "light")) {
          root.setAttribute("data-theme", event.newValue); label();
        }
      });
    })();
    // 실패해도 본문이 숨겨지지 않는 점진적 등장 효과.
    (function () {
      if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { entry.target.classList.add("in"); observer.unobserve(entry.target); }
        });
      }, { threshold: .08 });
      document.querySelectorAll(".reveal").forEach(function (element) { observer.observe(element); });
    })();
  </script>

  <script>
    // 입력 DOM을 유지하면서 목록 → 작성 → 완료로 이동한다.
    (function () {
      var views = {
        browse: document.getElementById("browseView"),
        compose: document.getElementById("composeView"),
        success: document.getElementById("successView")
      };
      var openButton = document.querySelector("[data-open-compose]");
      var form = views.compose.querySelector("form");
      var section = views.browse.parentElement;
      var current = "browse", timer, finishTimer, savedMessage = "";
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var base = location.pathname + location.search;
      function viewFromURL() {
        if (location.hash === "#write") return "compose";
        if (location.hash === "#shared" && savedMessage) return "success";
        return "browse";
      }
      function showView(next, focus, animate) {
        clearTimeout(timer); clearTimeout(finishTimer);
        Object.keys(views).forEach(function (key) {
          views[key].classList.remove("is-entering", "is-exiting");
          views[key].inert = false;
        });
        if (current === next && !views[next].hidden) return;
        function render() {
          Object.keys(views).forEach(function (key) { views[key].hidden = key !== next; });
          current = next;
          section.dataset.view = next;
          if (focus) {
            var mainTop = document.getElementById("main").getBoundingClientRect().top + window.scrollY;
            if (window.scrollY > mainTop) window.scrollTo({ top: Math.max(0, mainTop - 24), behavior: "instant" });
            var target = next === "browse" ? openButton : views[next].querySelector("h2");
            target.focus({ preventScroll: true });
          }
          if (animate && !motion.matches) {
            views[next].classList.add("is-entering");
            finishTimer = window.setTimeout(function () { views[next].classList.remove("is-entering"); }, 560);
          }
        }
        if (animate && !motion.matches) {
          views[current].classList.add("is-exiting");
          views[current].inert = true;
          timer = window.setTimeout(function () { views[current].inert = false; render(); }, 150);
        } else render();
      }
      function updateURL(next, replace) {
        var hash = next === "compose" ? "#write" : next === "success" ? "#shared" : "";
        try {
          var hasBrowseEntry = !replace || !!(history.state && history.state.communityFlow);
          var state = Object.assign({}, history.state, { communityFlow: next !== "browse" && hasBrowseEntry });
          history[replace ? "replaceState" : "pushState"](state, "", base + hash);
        } catch (error) {}
        showView(next, true, true);
      }
      function compose() {
        var status = form.querySelector(".notice[role='status']");
        if (current === "success" && status) status.textContent = "";
        updateURL("compose", current !== "browse");
      }
      function browse() {
        if (history.state && history.state.communityFlow) history.back();
        else updateURL("browse", true);
      }
      openButton.hidden = false;
      openButton.setAttribute("aria-controls", "composeView");
      openButton.addEventListener("click", compose);
      document.querySelectorAll("[data-compose-again]").forEach(function (button) { button.addEventListener("click", compose); });
      document.querySelectorAll("[data-show-browse]").forEach(function (button) { button.addEventListener("click", browse); });
      ["compose", "success"].forEach(function (key) {
        var heading = views[key].querySelector("h2");
        heading.id = "flow-" + key + "-title";
        views[key].setAttribute("role", "region");
        views[key].setAttribute("aria-labelledby", heading.id);
      });
      document.addEventListener("community:saved", function (event) {
        savedMessage = event.detail.message;
        views.success.querySelector("[data-success-message]").textContent = savedMessage;
        updateURL("success", current !== "browse");
      });
      function restore() {
        if (location.hash === "#shared" && !savedMessage) {
          try { history.replaceState(Object.assign({}, history.state, { communityFlow: false }), "", base); } catch (error) {}
        }
        showView(viewFromURL(), true, true);
      }
      window.addEventListener("popstate", restore);
      window.addEventListener("hashchange", restore);
      window.addEventListener("pageshow", function () { showView(viewFromURL(), false, false); });
      // 새로 연 완료 주소에는 확인하지 않은 저장 성공을 표시하지 않는다.
      if (location.hash === "#shared" && !savedMessage) {
        try { history.replaceState(Object.assign({}, history.state, { communityFlow: false }), "", base); } catch (error) {}
      }
      section.dataset.view = viewFromURL();
      showView(viewFromURL(), false, false);
      // 연결이 늦거나 실패해도 작성 화면 안에서 현재 상태를 알 수 있다.
      var connection = document.createElement("p");
      connection.className = "flow-connection";
      connection.setAttribute("role", "status");
      form.before(connection);
      var submit = form.querySelector("button[type='submit']");
      var list = views.browse.querySelector(".data-list");
      var connected = false;
      function availability() {
        if (!submit.disabled) connected = true;
        connection.hidden = connected;
        if (connected) return;
        connection.textContent = /unavailable|couldn.t load/i.test(list.textContent)
          ? "Writing is unavailable right now. Check your connection and reload to try again."
          : "Connecting… You can start writing while we connect.";
      }
      var observer = new MutationObserver(function () {
        availability();
        if (connected) observer.disconnect();
      });
      observer.observe(submit, { attributes: true, attributeFilter: ["disabled"] });
      observer.observe(list, { childList: true, subtree: true });
      availability();
      if (connected) observer.disconnect();
    })();
  </script>

  <script>
    // 보조 클릭은 기본 탐색을 유지하고, 뒤로 돌아오면 장막을 초기화한다.
    (function () {
      var root = document.documentElement;
      var label = document.getElementById("transitionName");
      var timer, recovery, leaving = false;
      function reset() {
        clearTimeout(timer); clearTimeout(recovery);
        leaving = false; root.classList.remove("is-leaving");
      }
      document.querySelectorAll(".community-gate, .page-nav a[href='community.html']:not([aria-current]), .content-end a[href='community.html']").forEach(function (link) {
        link.addEventListener("click", function (event) {
          if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute("download") || (link.target && link.target !== "_self")) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          event.preventDefault();
          if (leaving) return;
          leaving = true;
          var heading = link.querySelector("h2");
          label.textContent = heading ? heading.textContent : "Community";
          root.classList.add("is-leaving");
          timer = window.setTimeout(function () { window.location.assign(link.href); }, 470);
          recovery = window.setTimeout(reset, 2200);
        });
      });
      window.addEventListener("pageshow", reset);
      window.addEventListener("keydown", function (event) { if (event.key === "Escape" && leaving) reset(); });
    })();
  </script>
</body>
</html>
