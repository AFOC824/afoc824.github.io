<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // 저장소가 차단되어도 기본 테마로 화면을 표시한다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <title>Guestbook — 824</title>
  <meta name="description" content="Leave a little hello in the 824 guestbook.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guestbook — 824">
  <meta property="og:description" content="Leave a little hello in the 824 guestbook.">
  <style>
    /* 모든 페이지에서 같은 색상과 서체를 사용한다. */
    :root {
      --bg: #f8f8f8; --surface: #eeeeee; --text: #181818;
      --muted: #444444; --faint: #595959; --line: #d5d5d5; --field: #ffffff;
      --shell: 1440px; --gutter: clamp(22px, 5vw, 80px);
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #141414; --surface: #202020; --text: #f2f2f2;
      --muted: #cccccc; --faint: #b5b5b5; --line: #3c3c3c; --field: #1b1b1b;
      
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 17px; line-height: 1.65; font-feature-settings: "ss01"; }
    body { font-weight: 450; }
    a { color: inherit; text-underline-offset: 5px; }
    button, input, textarea, select { font: inherit; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:disabled { cursor: wait; opacity: .55; }
    a, button { touch-action: manipulation; }
    button, input, textarea, select { border-radius: 10px; }
    input, textarea, select { max-width: 100%; min-width: 0; color: var(--text); background: var(--field); }
    textarea { resize: vertical; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--text); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .mono, .eyebrow { font-family: var(--font-mono); font-size: .88rem; font-weight: 400; letter-spacing: -.02em; }
    .eyebrow { text-transform: uppercase; color: var(--muted); }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 12px 20px; background: var(--text); color: var(--bg); transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .theme-toggle { flex: 0 0 auto; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--text); transition: background .2s, color .2s, transform .2s; }
    .theme-toggle:hover { background: var(--text); color: var(--bg); transform: rotate(-12deg); }
    .theme-toggle svg { width: 20px; height: 20px; }
    /* 본문은 기본으로 보이고, 스크립트가 정상 실행된 경우에만 모션을 더한다. */
    .reveal.in { animation: appear .65s cubic-bezier(.2,.8,.2,1) both; }
    .reveal.d1.in { animation-delay: .08s; }
    .reveal.d2.in { animation-delay: .16s; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal, .item { opacity: 1 !important; transform: none !important; }
    }
    /* 본문을 가운데 놓고, 페이지 이동은 상단의 간단한 링크로 제공한다. */
    .page-shell { max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }
    .page-header { display: flex; align-items: center; gap: 24px; min-height: 96px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; min-height: 46px; font: .94rem var(--font-mono); font-weight: 600; letter-spacing: -.06em; text-decoration: none; }
    .brand:hover { text-decoration: underline; }
    .page-nav { display: flex; align-items: center; gap: 24px; margin-left: auto; }
    .page-nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; font: .94rem var(--font-mono); text-decoration: none; }
    .page-nav a:hover { text-decoration: underline; }
    .content { width: 100%; max-width: 1000px; margin-inline: auto; padding-block: 56px 80px; min-width: 0; }
    .content-end { border-top: 1px solid var(--line); padding-top: 20px; }
    .content-end a { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; color: var(--muted); text-decoration: none; font-size: 1rem; font-weight: 400; line-height: 1.5; }
    .content-end a:hover { color: var(--text); text-decoration: underline; }
    @media (max-width: 600px) {
      .page-header { min-height: 80px; gap: 16px; }
      .page-nav { gap: 16px; }
      .content { padding-block: 40px 56px; }
      .content-end { padding-top: 16px; }
    }
    .section { padding-bottom: 64px; min-width: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    .section-head h1 { margin: 0; font-weight: 500; font-size: clamp(2.7rem, 4.8vw, 4.5rem); letter-spacing: -.055em; line-height: 1.1; overflow-wrap: anywhere; }
    .section-symbol { flex: 0 0 auto; display: grid; place-items: center; width: 72px; height: 72px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); }
    .section-symbol svg { width: 42px; height: 42px; transform: rotate(-6deg); }
    .section-note { margin: 0 0 32px; max-width: 54ch; font-size: 1.1rem; color: var(--text); }
    /* 종이 모서리와 짧은 서명선으로 메모의 느낌을 더한다. */
    .form { position: relative; padding: 28px; margin-bottom: 32px; border: 1px solid var(--line); border-radius: 16px 0 16px 16px; background: var(--field); }
    .form::after { content: ""; position: absolute; top: -1px; right: -1px; width: 28px; height: 28px; background: linear-gradient(225deg, var(--bg) 47%, var(--line) 49%, var(--surface) 52%); pointer-events: none; }
    .form-heading { margin: 0 0 24px; padding-right: 16px; font-size: 1.0625rem; font-weight: 600; line-height: 1.5; }
    .form-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
    .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .field > span { font-size: .88rem; color: var(--muted); font-family: var(--font-mono); }
    .form .grow { flex: 1 1 180px; }
    .form input[type="text"], .form textarea, .form select, .sub-form input, .sub-form select {
      width: 100%; min-height: 48px; font: inherit; padding: 12px 14px; border: 1px solid var(--line); background: var(--field); color: var(--text); transition: border-color .2s;
    }
    .form input:focus, .form textarea:focus, .form select:focus, .sub-form input:focus, .sub-form select:focus { border-color: var(--text); }
    .form input::placeholder, .form textarea::placeholder, .sub-form input::placeholder { color: var(--faint); opacity: 1; }
    .form textarea { min-height: 142px; line-height: 1.65; resize: vertical; }
    .form select { min-width: 110px; padding-right: 8px; }
    .form button, .sub-form button { min-height: 48px; padding: 12px 28px; border: 1px solid var(--text); background: var(--text); color: var(--bg); font: .94rem var(--font-mono); transition: background .2s, color .2s; }
    .form button:hover:not(:disabled), .sub-form button:hover:not(:disabled) { background: var(--bg); color: var(--text); }
    .form .notice { margin: 12px 0 0; font-size: .88rem; color: var(--muted); }
    .notice:empty { display: none; }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; width: 100%; min-height: 168px; margin: 0; padding: 28px; text-align: center; border: 1px solid var(--line); border-radius: 16px; color: var(--muted); font: .94rem/1.6 var(--font-mono); }
    .empty::before { content: ""; display: block; width: 28px; height: 34px; border: 1px solid var(--muted); border-radius: 3px; background: repeating-linear-gradient(transparent 0 8px, var(--line) 8px 9px) center / 16px 18px no-repeat; transform: rotate(-6deg); }
    .board-list, .guest-wall, .rating-rail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .board-list .empty, .guest-wall .empty, .rating-rail .empty { grid-column: 1 / -1; }
    .card, .chip, .note { padding: 26px; min-width: 0; background: var(--field); border: 1px solid var(--line); border-radius: 16px; overflow-wrap: anywhere; }
    .note { position: relative; border-top-right-radius: 0; }
    .note::before { content: ""; position: absolute; top: -1px; right: -1px; width: 22px; height: 22px; background: linear-gradient(225deg, var(--bg) 47%, var(--line) 49%, var(--surface) 52%); pointer-events: none; }
    .note::after { content: ""; display: block; width: 48px; height: 1px; margin-top: 26px; background: var(--muted); }
    .note .head { padding-right: 12px; }
    .board-list .card:first-child { grid-column: 1 / -1; padding: 32px; }
    .card .head, .note .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 16px; }
    .who { font-weight: 600; font-size: 1rem; }
    .when { margin-left: auto; font: .88rem var(--font-mono); color: var(--muted); }
    .msg { margin: 0; font-size: 1.0625rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .board-list .card:first-child .msg { font-size: 1.4rem; line-height: 1.6; letter-spacing: -.015em; }
    .chip .head { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .chip .name { font-size: 1.6rem; line-height: 1.2; letter-spacing: -.035em; }
    .stars { white-space: nowrap; font-size: 1.25rem; letter-spacing: .02em; }
    .chip .author { font: .88rem var(--font-mono); color: var(--muted); }
    .chip-toggle { display: block; min-height: 48px; margin-top: 16px; padding: 10px 0; text-align: left; font: .88rem var(--font-mono); background: none; color: var(--text); border: 0; text-decoration: underline; text-underline-offset: 5px; }
    .chip-more { display: none; }
    .chip.open .chip-more { display: block; }
    .sub-form { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); margin: 6px 0 22px; }
    .sub-form input { flex: 1 1 140px; font-size: 17px; }
    .sub-form select { width: 100%; font-size: 17px; }
    .sub-form button { font-size: .88rem; padding-inline: 20px; }
    .sub-list .comment { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 1rem; }
    .sub-list .comment .stars { font-size: 1rem; color: var(--muted); }
    .sub-list .comment .text { overflow-wrap: anywhere; }
    .pop.in { animation: appear .5s ease both; }
    @media (max-width: 600px) {
      .board-list, .guest-wall, .rating-rail { grid-template-columns: 1fr; }
      .form-row { gap: 18px; }
      .form { padding: 20px 18px; }
      .form .grow { flex-basis: 100%; }
      .form textarea { min-height: 160px; }
      .card, .chip, .note, .board-list .card:first-child { padding: 22px; }
      .board-list .card:first-child .msg { font-size: 1.15rem; }
      .when { margin-left: 0; }
      .section-head { gap: 16px; }
      .section-head h1 { font-size: clamp(2.2rem, 9vw, 2.9rem); }
      .section-symbol { width: 52px; height: 52px; border-radius: 12px; }
      .section-symbol svg { width: 32px; height: 32px; }
    }
    .no-script { margin: 0 0 28px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; color: var(--muted); }

    /* 말풍선, 별, 종이의 서로 다른 움직임으로 각 공간에 들어간다. */
    .nav-transition { display: none; position: fixed; inset: 0; z-index: 60; overflow: hidden; isolation: isolate; color: var(--bg); pointer-events: none; }
    .is-leaving .nav-transition { display: grid; place-items: center; pointer-events: auto; }
    .transition-surface { position: absolute; inset: 0; z-index: -1; background: var(--text); }
    .transition-content { display: grid; justify-items: center; gap: 24px; padding: 24px; }
    .transition-label { font-size: clamp(2.6rem, 7vw, 6rem); font-weight: 500; letter-spacing: -.055em; line-height: 1.1; }
    .transition-icon { display: none; width: clamp(76px, 12vw, 132px); height: auto; overflow: visible; }
    .is-leaving .transition-label { animation: route-label .54s .33s ease both; }
    .nav-transition[data-motion="board"] .transition-icon[data-room="board"],
    .nav-transition[data-motion="ratings"] .transition-icon[data-room="ratings"],
    .nav-transition[data-motion="guestbook"] .transition-icon[data-room="guestbook"] { display: block; }
    .is-leaving [data-motion="board"] .transition-surface { animation: bubble-cover .78s cubic-bezier(.22,.75,.2,1) both; }
    .is-leaving [data-motion="board"] .transition-icon { animation: quote-pop .81s .09s cubic-bezier(.16,.85,.3,1) both; }
    .is-leaving [data-motion="board"] .quote-right { transform-origin: 72% 50%; animation: quote-answer .72s .195s ease both; }
    @keyframes bubble-cover {
      from { clip-path: inset(var(--cover-top) var(--cover-right) var(--cover-bottom) var(--cover-left) round 24px); }
      to { clip-path: inset(0 0 0 0 round 0); }
    }
    @keyframes quote-pop { 0% { opacity: 0; transform: translateY(28px) scale(.4); } 65% { opacity: 1; transform: translateY(-5px) scale(1.08); } 100% { transform: none; } }
    @keyframes quote-answer { from { opacity: 0; transform: translateY(18px) rotate(12deg); } to { opacity: 1; transform: none; } }
    .is-leaving [data-motion="ratings"] .transition-surface { animation: star-cover .825s cubic-bezier(.2,.65,.25,1) both; }
    .is-leaving [data-motion="ratings"] .transition-icon { animation: star-turn .90s cubic-bezier(.16,.8,.24,1) both; }
    .is-leaving [data-motion="ratings"] .star-spark { transform-box: fill-box; transform-origin: center; animation: star-spark .6s .255s ease-out both; }
    .is-leaving [data-motion="ratings"] .star-spark:last-child { animation-delay: .36s; }
    @keyframes star-cover { from { clip-path: circle(0 at var(--origin-x) var(--origin-y)); } to { clip-path: circle(150% at var(--origin-x) var(--origin-y)); } }
    @keyframes star-turn { from { opacity: 0; transform: rotate(-108deg) scale(.2); } 70% { opacity: 1; transform: rotate(8deg) scale(1.08); } to { transform: none; } }
    @keyframes star-spark { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
    .nav-transition[data-motion="guestbook"] { perspective: 1200px; }
    .is-leaving [data-motion="guestbook"] .transition-surface { transform-origin: right center; backface-visibility: hidden; animation: paper-cover .87s cubic-bezier(.2,.7,.2,1) both; }
    .is-leaving [data-motion="guestbook"] .transition-icon { animation: paper-settle .84s .045s cubic-bezier(.2,.8,.2,1) both; }
    .is-leaving [data-motion="guestbook"] .paper-signature { stroke-dasharray: 1; stroke-dashoffset: 1; animation: signature-draw .51s .36s ease forwards; }
    @keyframes paper-cover { from { transform: rotateY(-88deg); } to { transform: rotateY(0); } }
    @keyframes paper-settle { from { opacity: 0; transform: translateX(32px) rotate(16deg); } 75% { opacity: 1; transform: translateX(-3px) rotate(-3deg); } to { transform: none; } }
    @keyframes signature-draw { to { stroke-dashoffset: 0; } }
    .return-panels { display: none; position: absolute; inset: 0; z-index: -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .return-panel { display: grid; place-items: center; padding-bottom: 110px; background: var(--text); border-right: 1px solid var(--bg); }
    .return-panel:last-child { border-right: 0; }
    .return-panel svg { width: clamp(40px, 7vw, 76px); height: auto; }
    .nav-transition[data-motion="return"] .transition-surface { display: none; }
    .nav-transition[data-motion="return"] .return-panels { display: grid; }
    .nav-transition[data-motion="return"] .transition-content { padding-top: 130px; }
    .nav-transition[data-motion="return"] .transition-label { font-size: clamp(2.3rem, 7vw, 6rem); }
    .is-leaving [data-motion="return"] .return-panel { animation: panel-rejoin .69s cubic-bezier(.22,.75,.2,1) both; }
    .is-leaving [data-motion="return"] .return-panel:nth-child(2) { --panel-start: 101%; animation-delay: .105s; }
    .is-leaving [data-motion="return"] .return-panel:nth-child(3) { animation-delay: .21s; }
    .is-leaving [data-motion="return"] .return-panel svg { animation: panel-icon .48s .375s ease both; }
    @keyframes panel-rejoin { from { transform: translateY(var(--panel-start, -101%)); } to { transform: none; } }
    @keyframes panel-icon { from { opacity: 0; transform: scale(.65); } to { opacity: 1; transform: none; } }
    @keyframes route-label { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .is-leaving .nav-transition { display: none; } }

    /* 목록, 작성, 완료는 한 번에 한 화면만 보여준다. */
    .section { min-height: min(620px, 72svh); }
    .browse-actions { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
    .browse-actions .section-note { max-width: 46ch; margin: 0; }
    .flow-button { display: inline-flex; align-items: center; justify-content: center; gap: 22px; flex-shrink: 0; min-height: 48px; padding: 12px 22px; border: 1px solid var(--text); border-radius: 999px; background: var(--text); color: var(--bg); font-size: 1rem; line-height: 1.4; text-decoration: none; transition: transform .2s, background .2s, color .2s; }
    .flow-button:hover { transform: translateY(-2px); background: var(--bg); color: var(--text); }
    .flow-button span { transition: transform .2s; }
    .flow-button:hover span { transform: translate(2px, -2px); }
    .flow-back { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; margin: 0 0 24px; padding: 0; background: none; border: 0; border-radius: 0; color: var(--muted); font-size: .94rem; }
    .flow-back:hover { color: var(--text); text-decoration: underline; text-underline-offset: 5px; }
    #composeView { max-width: 760px; margin-inline: auto; }
    .flow-view h2 { margin: 0 0 28px; font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 500; letter-spacing: -.045em; line-height: 1.2; overflow-wrap: anywhere; }
    #composeView .form { margin-bottom: 0; }
    .flow-connection { margin: -8px 0 24px; color: var(--muted); font-size: .94rem; }
    #successView { max-width: 760px; margin-inline: auto; padding-block: clamp(28px, 7vh, 80px); }
    .success-mark { width: 64px; height: 64px; margin-bottom: 30px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    #successView h2 { margin-bottom: 14px; }
    #successView p { margin: 0; max-width: 45ch; font-size: 1.1rem; }
    .success-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 32px; }
    .success-actions [data-compose-again] { background: transparent; border-color: var(--line); color: var(--text); }
    .success-actions [data-compose-again]:hover { border-color: var(--text); }
    /* 종이 윗변을 기준으로 펼치고, 완료 표시는 도장처럼 내려찍는다. */
    .flow-view.is-exiting { transform-origin: 50% 0; animation: flow-out .22s ease-in both; }
    .flow-view.is-entering { transform-origin: 50% 0; animation: flow-in .72s cubic-bezier(.2,.75,.2,1) both; }
    #successView.is-entering .success-mark { animation: mark-in .75s cubic-bezier(.2,.75,.2,1) both; }
    @keyframes flow-out { to { opacity: 0; transform: perspective(1200px) translateY(5px) rotateX(3deg); } }
    @keyframes flow-in {
      from { opacity: 0; transform: perspective(1200px) translateY(14px) rotateX(-8deg); }
      to { opacity: 1; transform: perspective(1200px) translateY(0) rotateX(0); }
    }
    @keyframes mark-in {
      from { opacity: 0; transform: translateY(-18px) rotate(-7deg) scale(1.2); }
      46% { opacity: 1; transform: translateY(2px) rotate(-7deg) scale(.94); }
      66% { transform: translateY(-2px) rotate(-3deg) scale(1.02); }
      to { opacity: 1; transform: none; }
    }
    @media (max-width: 600px) {
      .browse-actions { flex-direction: column; gap: 20px; margin-bottom: 28px; }
      .flow-view h2 { margin-bottom: 24px; }
      .flow-back { margin-bottom: 20px; }
      .success-actions { align-items: stretch; flex-direction: column; }
      .success-actions .flow-button { width: fit-content; max-width: 100%; }
    }
  </style>
  <noscript><style>.form, .data-list { display: none; }</style></noscript>
</head>
<body>
  <div class="nav-transition" aria-hidden="true">
    <div class="transition-surface"></div>
    <div class="return-panels">

  <script type="module">
    // 외부 파일을 불러오지 못해도 안내 문구와 페이지 탐색은 유지한다.
    async function initializeGuestbook() {
    const [appModule, firestoreModule] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js")
    ]);
    const { initializeApp } = appModule;
    const {
      getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp
    } = firestoreModule;

    const firebaseConfig = {
      apiKey: "AIzaSyCiuEisvgKaSyMAP4hLM5qk_L94oK6oyP4",
      authDomain: "afoc824-52dad.firebaseapp.com",
      projectId: "afoc824-52dad",
      storageBucket: "afoc824-52dad.firebasestorage.app",
      messagingSenderId: "638791232483",
      appId: "1:638791232483:web:0b8bb7e968c985face8ed6"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // 공통 도구
    function formatDate(ts) {
      if (!ts || typeof ts.toDate !== "function") return "";
      let d;
      try { d = ts.toDate(); } catch (error) { return ""; }
      if (!(d instanceof Date) || !Number.isFinite(d.getTime())) return "";
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate());
    }

    function showEmpty(box, msg) {
      box.innerHTML = "";
      const p = document.createElement("p");
      p.className = "empty";
      p.setAttribute("role", "status");
      p.textContent = msg;
      box.appendChild(p);
    }

    // 카드를 붙인 다음 프레임에서 순차 등장 모션을 시작한다.
    function popIn(el, index) {
      if (reduceMotion) { el.classList.add("pop", "in"); return; }
      el.classList.add("pop");
      el.style.animationDelay = Math.min(index * 70, 480) + "ms";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { el.classList.add("in"); });
      });
    }

    // 방명록
    (function () {
      const nameInput = document.querySelector("#guestName");
      const textInput = document.querySelector("#guestText");
      const button = document.querySelector("#guestButton");
      const list = document.querySelector("#guestList");
      const status = document.querySelector("#guestStatus");

      document.querySelector("#guestForm").onsubmit = async function (event) {
        event.preventDefault();
        if (button.disabled) return;
        const name = nameInput.value.trim();
        const text = textInput.value.trim();

        if (!name || !text) { alert("Please fill in both name and message."); return; }
        if (name.length > 20 || text.length > 500) {
          alert("Name can be up to 20 characters, message up to 500."); return;
        }

        button.disabled = true;
        button.textContent = "Posting…";
        status.textContent = "Saving your note…";
        let saved = false;
        // 저장이 끝나기 전에 새 입력이 이전 요청에 의해 지워지지 않도록 잠근다.
        const controls = Array.from(this.querySelectorAll("input, textarea, select, .star-choice"), function (control) {
          return { element: control, disabled: control.disabled };
        });
        controls.forEach(function (control) { control.element.disabled = true; });
        try {
          await addDoc(collection(db, "guestbook"), {
            name: name, text: text, createdAt: serverTimestamp()
          });
          nameInput.value = "";
          textInput.value = "";
          status.textContent = "Your note is now live.";
          saved = true;
        } catch (err) {
          status.textContent = "Couldn't save your note. Your text is still here; please try again.";
          console.error(err);
        }
        controls.forEach(function (control) { control.element.disabled = control.disabled; });
        button.disabled = false;
        button.textContent = "Post";
        if (saved) {
          document.dispatchEvent(new CustomEvent("community:saved", {
            detail: { message: "Your note is now in the guestbook." }
          }));
        }
      };

      onSnapshot(
        query(collection(db, "guestbook"), orderBy("createdAt", "desc"), limit(100)),
        function (snap) {
          if (snap.empty) {
            showEmpty(list, "No notes yet.");
            return;
          }
          list.innerHTML = "";
          let i = 0;
          snap.forEach(function (docSnap) {
            const d = docSnap.data();

            const note = document.createElement("div");
            note.className = "note";

            const head = document.createElement("div");
            head.className = "head";

            const who = document.createElement("span");
            who.className = "who";
            who.textContent = d.name;

            const when = document.createElement("span");
            when.className = "when";
            when.textContent = formatDate(d.createdAt);

            head.append(who, when);

            const msg = document.createElement("p");
            msg.className = "msg";
            msg.textContent = d.text;

            note.append(head, msg);
            list.appendChild(note);
            popIn(note, i++);
          });
        },
        function (err) { showEmpty(list, "Couldn't load the guestbook."); console.error(err); }
      );
    })();

    document.querySelectorAll(".form button[type='submit']").forEach(function (button) {
      button.disabled = false;
    });
    }

    initializeGuestbook().catch(function (error) {
      document.querySelectorAll("#guestList").forEach(function (list) {
        const message = document.createElement("p");
        message.className = "empty";
        message.setAttribute("role", "status");
        message.textContent = "Guestbook is unavailable right now. Check your connection and reload to try again.";
        list.replaceChildren(message);
      });
      console.error("Guestbook initialization failed:", error);
    });
  </script>

  <script>
    // 테마 저장에 실패하더라도 전환 기능은 유지한다.
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
      var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg>';
      function label() {
        var dark = root.getAttribute("data-theme") === "dark";
        toggle.innerHTML = dark ? sun : moon;
        toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        toggle.title = dark ? "Light theme" : "Dark theme";
      }
      toggle.hidden = false;
      label();
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      window.addEventListener("storage", function (event) {
        if (event.key === "theme" && (event.newValue === "dark" || event.newValue === "light")) {
          root.setAttribute("data-theme", event.newValue); label();
        }
      });
    })();
    // 실패해도 본문이 숨겨지지 않는 점진적 등장 효과.
    (function () {
      if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { entry.target.classList.add("in"); observer.unobserve(entry.target); }
        });
      }, { threshold: .08 });
      document.querySelectorAll(".reveal").forEach(function (element) { observer.observe(element); });
    })();
  </script>

  <script>
    // 입력 DOM을 유지하면서 목록 → 작성 → 완료로 이동한다.
    (function () {
      var views = {
        browse: document.getElementById("browseView"),
        compose: document.getElementById("composeView"),
        success: document.getElementById("successView")
      };
      var openButton = document.querySelector("[data-open-compose]");
      var form = views.compose.querySelector("form");
      var section = views.browse.parentElement;
      var current = "browse", timer, finishTimer, savedMessage = "";
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var base = location.pathname + location.search;
      function viewFromURL() {
        if (location.hash === "#write") return "compose";
        if (location.hash === "#shared" && savedMessage) return "success";
        return "browse";
      }
      function showView(next, focus, animate) {
        clearTimeout(timer); clearTimeout(finishTimer);
        Object.keys(views).forEach(function (key) {
          views[key].classList.remove("is-entering", "is-exiting");
          views[key].inert = false;
        });
        if (current === next && !views[next].hidden) return;
        function render() {
          Object.keys(views).forEach(function (key) { views[key].hidden = key !== next; });
          current = next;
          section.dataset.view = next;
          if (focus) {
            var mainTop = document.getElementById("main").getBoundingClientRect().top + window.scrollY;
            if (window.scrollY > mainTop) window.scrollTo({ top: Math.max(0, mainTop - 24), behavior: "instant" });
            var target = next === "browse" ? openButton : views[next].querySelector("h2");
            target.focus({ preventScroll: true });
          }
          if (animate && !motion.matches) {
            views[next].classList.add("is-entering");
            finishTimer = window.setTimeout(function () { views[next].classList.remove("is-entering"); }, 840);
          }
        }
        if (animate && !motion.matches) {
          views[current].classList.add("is-exiting");
          views[current].inert = true;
          timer = window.setTimeout(function () { views[current].inert = false; render(); }, 220);
        } else render();
      }
      function updateURL(next, replace) {
        var hash = next === "compose" ? "#write" : next === "success" ? "#shared" : "";
        try {
          var hasBrowseEntry = !replace || !!(history.state && history.state.communityFlow);
          var state = Object.assign({}, history.state, { communityFlow: next !== "browse" && hasBrowseEntry });
          history[replace ? "replaceState" : "pushState"](state, "", base + hash);
        } catch (error) {}
        showView(next, true, true);
      }
      function compose() {
        var status = form.querySelector(".notice[role='status']");
        if (current === "success" && status) status.textContent = "";
        updateURL("compose", current !== "browse");
      }
      function browse() {
        if (history.state && history.state.communityFlow) history.back();
        else updateURL("browse", true);
      }
      openButton.hidden = false;
      openButton.setAttribute("aria-controls", "composeView");
      openButton.addEventListener("click", compose);
      document.querySelectorAll("[data-compose-again]").forEach(function (button) { button.addEventListener("click", compose); });
      document.querySelectorAll("[data-show-browse]").forEach(function (button) { button.addEventListener("click", browse); });
      ["compose", "success"].forEach(function (key) {
        var heading = views[key].querySelector("h2");
        heading.id = "flow-" + key + "-title";
        views[key].setAttribute("role", "region");
        views[key].setAttribute("aria-labelledby", heading.id);
      });
      document.addEventListener("community:saved", function (event) {
        savedMessage = event.detail.message;
        views.success.querySelector("[data-success-message]").textContent = savedMessage;
        updateURL("success", current !== "browse");
      });
      function restore() {
        if (location.hash === "#shared" && !savedMessage) {
          try { history.replaceState(Object.assign({}, history.state, { communityFlow: false }), "", base); } catch (error) {}
        }
        showView(viewFromURL(), true, true);
      }
      window.addEventListener("popstate", restore);
      window.addEventListener("hashchange", restore);
      window.addEventListener("pageshow", function () { showView(viewFromURL(), false, false); });
      // 새로 연 완료 주소에는 확인하지 않은 저장 성공을 표시하지 않는다.
      if (location.hash === "#shared" && !savedMessage) {
        try { history.replaceState(Object.assign({}, history.state, { communityFlow: false }), "", base); } catch (error) {}
      }
      section.dataset.view = viewFromURL();
      showView(viewFromURL(), false, false);
      // 연결이 늦거나 실패해도 작성 화면 안에서 현재 상태를 알 수 있다.
      var connection = document.createElement("p");
      connection.className = "flow-connection";
      connection.setAttribute("role", "status");
      form.before(connection);
      var submit = form.querySelector("button[type='submit']");
      var list = views.browse.querySelector(".data-list");
      var connected = false;
      function availability() {
        if (!submit.disabled) connected = true;
        connection.hidden = connected;
        if (connected) return;
        connection.textContent = /unavailable|couldn.t load/i.test(list.textContent)
          ? "Writing is unavailable right now. Check your connection and reload to try again."
          : "Connecting… You can start writing while we connect.";
      }
      var observer = new MutationObserver(function () {
        availability();
        if (connected) observer.disconnect();
      });
      observer.observe(submit, { attributes: true, attributeFilter: ["disabled"] });
      observer.observe(list, { childList: true, subtree: true });
      availability();
      if (connected) observer.disconnect();
    })();
  </script>

  <script>
    // 보조 클릭은 기본 탐색을 유지하고, 누른 입구의 아이콘과 위치를 모션에 반영한다.
    (function () {
      var root = document.documentElement;
      var overlay = document.querySelector(".nav-transition");
      var label = document.getElementById("transitionName");
      var timer, recovery, leaving = false;
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      function reset() {
        clearTimeout(timer); clearTimeout(recovery);
        leaving = false; root.classList.remove("is-leaving");
        overlay.removeAttribute("data-motion");
        overlay.removeAttribute("style");
      }
      document.querySelectorAll(".community-gate, .page-nav a[href='community.html']:not([aria-current]), .content-end a[href='community.html']").forEach(function (link) {
        link.addEventListener("click", function (event) {
          if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute("download") || (link.target && link.target !== "_self")) return;
          if (motion.matches) return;
          event.preventDefault();
          if (leaving) return;
          leaving = true;
          var heading = link.querySelector("h2");
          var room = heading ? link.getAttribute("href").replace(".html", "") : "return";
          var rect = link.getBoundingClientRect();
          var art = link.querySelector(".gate-art");
          var origin = art ? art.getBoundingClientRect() : rect;
          var width = window.innerWidth, height = window.innerHeight;
          function percent(value, total) { return Math.min(100, Math.max(0, value / total * 100)) + "%"; }
          overlay.dataset.motion = room;
          overlay.style.setProperty("--cover-top", percent(rect.top, height));
          overlay.style.setProperty("--cover-right", percent(width - rect.right, width));
          overlay.style.setProperty("--cover-bottom", percent(height - rect.bottom, height));
          overlay.style.setProperty("--cover-left", percent(rect.left, width));
          overlay.style.setProperty("--origin-x", percent(origin.left + origin.width / 2, width));
          overlay.style.setProperty("--origin-y", percent(origin.top + origin.height / 2, height));
          label.textContent = heading ? heading.textContent : "Community";
          root.classList.add("is-leaving");
          timer = window.setTimeout(function () { window.location.assign(link.href); }, 1040);
          recovery = window.setTimeout(reset, 3000);
        });
      });
      window.addEventListener("pageshow", reset);
      window.addEventListener("keydown", function (event) { if (event.key === "Escape" && leaving) reset(); });
      motion.addEventListener("change", function (event) { if (event.matches && leaving) reset(); });
    })();
  </script>
