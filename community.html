<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // 기존 탭 주소로 방문하면 해당 독립 페이지로 연결한다.
    (function () {
      function openLegacyPage() {
        var section = location.hash.slice(1);
        if (["board", "ratings", "guestbook"].indexOf(section) !== -1) {
          location.replace(section + ".html" + location.search);
        }
      }
      openLegacyPage();
      window.addEventListener("hashchange", openLegacyPage);
    })();
  </script>
  <script>
    // 저장소가 차단되어도 기본 테마로 화면을 표시한다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <title>Community — 824</title>
  <meta name="description" content="A space for shared thoughts, ratings, and a little hello.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Community — 824">
  <meta property="og:description" content="A space for shared thoughts, ratings, and a little hello.">
  <style>
    /* 모든 페이지에서 같은 색상과 서체를 사용한다. */
    :root {
      --bg: #f8f8f8; --surface: #eeeeee; --text: #181818;
      --muted: #444444; --faint: #595959; --line: #d5d5d5; --field: #ffffff;
      --shell: 1440px; --gutter: clamp(22px, 5vw, 80px);
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #141414; --surface: #202020; --text: #f2f2f2;
      --muted: #cccccc; --faint: #b5b5b5; --line: #3c3c3c; --field: #1b1b1b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 17px; line-height: 1.65; font-feature-settings: "ss01"; }
    body { font-weight: 450; }
    a { color: inherit; text-underline-offset: 5px; }
    button, input, textarea, select { font: inherit; }
    button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { color: inherit; cursor: pointer; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--text); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .page-shell { width: 100%; max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }
    .mono, .eyebrow { font-family: var(--font-mono); font-size: .88rem; font-weight: 400; }
    .eyebrow { text-transform: uppercase; color: var(--muted); }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 12px 20px; background: var(--text); color: var(--bg); transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .page-header { min-height: 96px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; min-height: 44px; font: .94rem var(--font-mono); text-decoration: none; }
    .page-nav { display: flex; align-items: center; gap: 26px; margin-left: auto; }
    .page-nav a { display: inline-flex; align-items: center; min-height: 44px; font-size: 1rem; text-decoration: none; }
    .page-nav a:hover, .page-nav a[aria-current="page"] { text-decoration: underline; }
    .theme-toggle { flex: 0 0 auto; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
    .theme-toggle:hover { background: var(--text); color: var(--bg); }
    .theme-toggle svg { width: 20px; height: 20px; }
    /* 스크립트 없이도 모든 내용을 읽을 수 있는 등장 효과. */
    .reveal.in { animation: appear .65s cubic-bezier(.2,.8,.2,1) both; }
    .reveal.d1.in { animation-delay: .08s; }
    .reveal.d2.in { animation-delay: .16s; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (max-width: 600px) {
      .page-header { min-height: 80px; gap: 16px; }
      .page-nav { gap: 18px; }
      .page-nav a { font-size: .94rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
    }
    .community-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-block: 48px 36px; }
    .community-intro h1 { margin: 0; font-size: clamp(3.4rem, 7vw, 6.5rem); font-weight: 500; line-height: 1.05; letter-spacing: -.055em; }
    /* 화면을 세 개의 큰 입구로 나누며 각 구역 전체가 링크다. */
    .community-gates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 56px; }
    .community-gate { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: clamp(460px, 53svh, 620px); padding: 28px clamp(24px, 2.5vw, 40px) 32px; border: 1px solid var(--line); border-radius: 20px; color: var(--text); background: var(--bg); text-decoration: none; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .community-gate:nth-child(2) { background: var(--text); color: var(--bg); }
    .gate-kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: .88rem var(--font-mono); }
    .gate-arrow { font-size: 1.8rem; line-height: 1; transition: transform .25s; }
    .gate-art { display: grid; place-items: center; flex: 1; min-height: 180px; padding-block: 28px 38px; }
    .gate-art svg { width: min(74%, 200px); height: auto; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
    .gate-copy h2 { margin: 0; font-size: clamp(2rem, 3.8vw, 3.4rem); font-weight: 500; line-height: 1.08; letter-spacing: -.05em; }
    .gate-copy p { margin: 16px 0 0; max-width: 27ch; min-height: 3.3em; font-size: 1rem; color: var(--muted); }
    .community-gate:nth-child(2) .gate-copy p { color: inherit; }
    .community-gate:hover { transform: translateY(-5px); }
    .community-gate:hover .gate-arrow { transform: translate(4px, -4px); }
    .community-gate:hover .gate-art svg { transform: translateY(-8px) rotate(-4deg); }
    .community-gate:hover h2, .community-gate:focus-visible h2 { text-decoration: underline; text-underline-offset: 8px; }
    .community-gate:focus-visible { z-index: 1; }
    @media (max-width: 860px) {
      .community-intro { display: block; padding-block: 36px 30px; }
      .community-intro h1 { font-size: clamp(3.3rem, 9vw, 5rem); }
      .community-gates { grid-template-columns: 1fr; margin-bottom: 36px; }
      .community-gate { min-height: 290px; padding: 24px; }
      .gate-art { position: absolute; right: 22px; top: 54px; padding: 0; min-height: 0; width: 112px; height: 112px; }
      .gate-art svg { width: 100%; }
      .gate-copy { margin-top: 96px; }
      .gate-copy h2 { font-size: clamp(2.5rem, 6vw, 3.1rem); }
      .gate-copy p { min-height: 0; max-width: 28ch; margin-top: 12px; }
    }
    @media (max-width: 380px) {
      .community-intro h1 { font-size: 3rem; }
      .gate-art { width: 88px; height: 88px; top: 58px; }
      .gate-copy { margin-top: 84px; }
    }

    /* 커뮤니티 입구와 돌아가기 링크에 같은 장막 전환을 적용한다. */
    .nav-transition { display: none; position: fixed; inset: 0; z-index: 60; place-items: center; background: var(--text); color: var(--bg); pointer-events: none; }
    .nav-transition span { font-size: clamp(2.8rem, 8vw, 7rem); font-weight: 500; letter-spacing: -.055em; }
    .is-leaving .nav-transition { display: grid; animation: community-cover .45s cubic-bezier(.76,0,.24,1) both; }
    @keyframes community-cover { from { transform: translateY(101%); border-radius: 32% 32% 0 0; } to { transform: translateY(0); border-radius: 0; } }
    @media (prefers-reduced-motion: reduce) { .is-leaving .nav-transition { display: none; } }
  </style>
</head>
<body>
  <div class="nav-transition" aria-hidden="true"><span id="transitionName"></span></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-shell">
    <header class="page-header">
      <a class="brand" href="index.html" aria-label="824 home">824.</a>
      <nav class="page-nav" aria-label="Main navigation">
        <a href="profile.html">Profile</a>
        <a href="community.html" aria-current="page">Community</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg></button>
    </header>
    <main id="main" tabindex="-1">
      <header class="community-intro">
        <h1>Community.</h1>
      </header>
      <div class="community-gates">
        <a class="community-gate" href="board.html">
          <div class="gate-kicker"><span>SHARE A THOUGHT</span><span class="gate-arrow" aria-hidden="true">↗</span></div>
          <div class="gate-art" aria-hidden="true">
            <svg viewBox="0 0 200 200" fill="currentColor"><path d="M25 108V84c0-32 16-55 47-65l10 21C63 48 53 61 52 80h33v81H25zm92 0V84c0-32 16-55 47-65l10 21c-19 8-29 21-30 40h33v81h-60z"/></svg>
          </div>
          <div class="gate-copy"><h2>Board</h2><p>Share a thought.<br>Start a conversation.</p></div>
        </a>
        <a class="community-gate" href="ratings.html">
          <div class="gate-kicker"><span>FIND A FAVORITE</span><span class="gate-arrow" aria-hidden="true">↗</span></div>
          <div class="gate-art" aria-hidden="true">
            <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2"><path d="m100 18 24 52 56 7-41 40 11 57-50-27-50 27 11-57-41-40 56-7z"/><path d="M100 18v129M20 77l130 97M180 77 50 174" opacity=".4"/></svg>
          </div>
          <div class="gate-copy"><h2>Ratings</h2><p>Share what you love.<br>See what others think.</p></div>
        </a>
        <a class="community-gate" href="guestbook.html">
          <div class="gate-kicker"><span>LEAVE A LITTLE HELLO</span><span class="gate-arrow" aria-hidden="true">↗</span></div>
          <div class="gate-art" aria-hidden="true">
            <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2"><path d="M28 32h113l29 29v109H28zM141 32v30h29"/><path d="M49 126c23-9 66-58 53-65-14-8-46 75-28 76 10 0 28-33 29-25 1 5-9 28 0 25 11-5 20-27 24-23 3 3-8 21-2 22 7 1 15-8 22-6" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 150h98"/></svg>
          </div>
          <div class="gate-copy"><h2>Guestbook</h2><p>You were here.<br>Leave a few words to remember.</p></div>
        </a>
      </div>
    </main>
  </div>
  <script>
    // 테마 저장에 실패하더라도 전환 기능은 유지한다.
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
      var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></svg>';
      function label() {
        var dark = root.getAttribute("data-theme") === "dark";
        toggle.innerHTML = dark ? sun : moon;
        toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        toggle.title = dark ? "Light theme" : "Dark theme";
      }
      label();
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      window.addEventListener("storage", function (event) {
        if (event.key === "theme" && (event.newValue === "dark" || event.newValue === "light")) {
          root.setAttribute("data-theme", event.newValue); label();
        }
      });
    })();
    // 실패해도 본문이 숨겨지지 않는 점진적 등장 효과.
    (function () {
      if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { entry.target.classList.add("in"); observer.unobserve(entry.target); }
        });
      }, { threshold: .08 });
      document.querySelectorAll(".reveal").forEach(function (element) { observer.observe(element); });
    })();

  </script>

  <script>
    // 보조 클릭은 기본 탐색을 유지하고, 뒤로 돌아오면 장막을 초기화한다.
    (function () {
      var root = document.documentElement;
      var label = document.getElementById("transitionName");
      var timer, recovery, leaving = false;
      function reset() {
        clearTimeout(timer); clearTimeout(recovery);
        leaving = false; root.classList.remove("is-leaving");
      }
      document.querySelectorAll(".community-gate, .page-nav a[href='community.html']:not([aria-current]), .content-end a[href='community.html']").forEach(function (link) {
        link.addEventListener("click", function (event) {
          if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.hasAttribute("download") || (link.target && link.target !== "_self")) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          event.preventDefault();
          if (leaving) return;
          leaving = true;
          var heading = link.querySelector("h2");
          label.textContent = heading ? heading.textContent : "Community";
          root.classList.add("is-leaving");
          timer = window.setTimeout(function () { window.location.assign(link.href); }, 470);
          recovery = window.setTimeout(reset, 2200);
        });
      });
      window.addEventListener("pageshow", reset);
      window.addEventListener("keydown", function (event) { if (event.key === "Escape" && leaving) reset(); });
    })();
  </script>
</body>
</html>
